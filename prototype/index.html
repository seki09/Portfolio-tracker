<title>Depot Ledger</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --plane:#eef1f4; --surface:#ffffff; --surface-2:#f7f9fa; --surface-3:#eceff2;
  --ink:#10161c; --ink-2:#4a5560; --muted:#77838d;
  --line:#dde3e8; --line-2:#c6ced5;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-wash:rgba(42,120,214,.10);
  --band:#b9c3cb; --band-fill:rgba(185,195,203,.34);
  --pos:#006300; --neg:#c0322f; --pos-chip:rgba(12,163,12,.12); --neg-chip:rgba(208,59,59,.12);
  --warn:#9a6b00; --warn-chip:rgba(250,178,25,.16);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --focus:#2a78d6;
  --r:7px; --rail:208px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --plane:#0b0e11; --surface:#14181c; --surface-2:#191e23; --surface-3:#21272d;
  --ink:#eef2f5; --ink-2:#a7b3bd; --muted:#7d8992;
  --line:#242b31; --line-2:#333c44;
  --accent:#3987e5; --accent-ink:#79b0f2; --accent-wash:rgba(57,135,229,.16);
  --band:#4d5960; --band-fill:rgba(120,134,144,.28);
  --pos:#2fb84a; --neg:#ef7070; --pos-chip:rgba(47,184,74,.15); --neg-chip:rgba(239,112,112,.15);
  --warn:#e0a53a; --warn-chip:rgba(250,178,25,.14);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --focus:#79b0f2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --plane:#0b0e11; --surface:#14181c; --surface-2:#191e23; --surface-3:#21272d;
  --ink:#eef2f5; --ink-2:#a7b3bd; --muted:#7d8992;
  --line:#242b31; --line-2:#333c44;
  --accent:#3987e5; --accent-ink:#79b0f2; --accent-wash:rgba(57,135,229,.16);
  --band:#4d5960; --band-fill:rgba(120,134,144,.28);
  --pos:#2fb84a; --neg:#ef7070; --pos-chip:rgba(47,184,74,.15); --neg-chip:rgba(239,112,112,.15);
  --warn:#e0a53a; --warn-chip:rgba(250,178,25,.14);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --focus:#79b0f2;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100%}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  display:flex;flex-direction:column;gap:2px;padding:18px 12px 24px;
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;
}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 16px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.brand .mark{width:22px;height:22px;border-radius:5px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark span{color:#fff;font-size:12px;font-weight:700;letter-spacing:-.02em}
.brand b{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.navhead{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 8px 5px;font-weight:600}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:6px;color:var(--ink-2);text-align:left;font-size:13px}
.nav:hover{background:var(--surface-3);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-wash);color:var(--accent-ink);font-weight:600}
.nav svg{flex:none;opacity:.85}
.nav .badge{margin-left:auto;background:var(--warn-chip);color:var(--warn);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px}
.main{min-width:0;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 22px;border-bottom:1px solid var(--line);background:var(--surface);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:6px;padding:5px 9px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.pill:hover{border-color:var(--muted);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{padding:5px 9px;font-size:12px;color:var(--ink-2);border-right:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-3);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.spacer{margin-left:auto}
.kbd{border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:2px 6px;font-size:11px;color:var(--muted)}
.content{padding:22px;display:flex;flex-direction:column;gap:18px}

/* ---------- generic ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.phead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-size:13px;font-weight:600;letter-spacing:-.005em}
.phead .sub{font-size:11.5px;color:var(--muted)}
.pbody{padding:16px}
h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.lede{color:var(--ink-2);font-size:13px;margin:4px 0 0;max-width:62ch}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap}
.chip.pos{background:var(--pos-chip);color:var(--pos)}
.chip.neg{background:var(--neg-chip);color:var(--neg)}
.chip.warn{background:var(--warn-chip);color:var(--warn)}
.chip.neutral{background:var(--surface-3);color:var(--ink-2)}
.chip.info{background:var(--accent-wash);color:var(--accent-ink)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.stale{font-size:10.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:20px;padding:1px 7px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:500;background:var(--surface)}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-wash)}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:1fr;gap:0}
.herotop{padding:18px 20px 12px;display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.totlabel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.total{font-size:36px;font-weight:600;letter-spacing:-.025em;line-height:1.1;margin-top:3px}
.totrow{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-left:auto;padding-top:6px}
.stat .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.chartwrap{position:relative;padding:4px 14px 12px}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:16px;align-items:center;padding:0 20px 14px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2)}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.tip{
  position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);
  border-radius:6px;padding:8px 10px;font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.12);
  min-width:168px;z-index:5;
}
.tip .t{font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .r span:first-child{color:var(--ink-2);display:flex;align-items:center;gap:6px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}

.alloc{display:flex;flex-direction:column;gap:11px}
.allocrow .top{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;margin-bottom:4px}
.allocrow .top b{font-weight:500}
.allocrow .top .v{color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

.movers{display:flex;flex-direction:column}
.mover{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.mover:last-child{border-bottom:0}
.mover .tk{font-weight:600;font-size:12.5px;width:60px;flex:none}
.mover .nm{color:var(--muted);font-size:11.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mover .val{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:500}
.note{display:flex;gap:9px;align-items:flex-start;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:660px}
th{
  text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)
}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.expander{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.caret{width:14px;flex:none;color:var(--muted);transition:transform .15s ease;display:inline-block}
.caret.open{transform:rotate(90deg)}
.secname{display:flex;flex-direction:column;gap:1px;min-width:0}
.secname b{font-weight:600;font-size:12.5px}
.secname span{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lots{background:var(--surface-2)}
.lots td{padding:0 12px 0 0}
.lots table{min-width:0;font-size:11.5px}
.lots th{background:transparent;font-size:9.5px;padding:7px 12px}
.lots td{padding:6px 12px;border-bottom:1px solid var(--line)}
.lots tr:last-child td{border-bottom:0}
.fx{border-bottom:1px dotted var(--line-2);cursor:help}
.w{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.w .bar{width:44px;flex:none}
</style>
<style>
/* ---------- import ---------- */
.stepper{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.step{display:flex;align-items:center;gap:8px;padding:11px 16px;font-size:12px;color:var(--muted);position:relative;flex:1;min-width:132px}
.step .n{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.step[data-state="done"]{color:var(--ink-2)}
.step[data-state="done"] .n{background:var(--accent);border-color:var(--accent);color:#fff}
.step[data-state="active"]{color:var(--ink);font-weight:600;background:var(--surface)}
.step[data-state="active"] .n{border-color:var(--accent);color:var(--accent-ink)}
.step+.step{border-left:1px solid var(--line)}
.drop{
  border:1.5px dashed var(--line-2);border-radius:var(--r);padding:30px 20px;text-align:center;
  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:8px
}
.drop b{font-size:14px;font-weight:600}
.drop p{margin:0;color:var(--muted);font-size:12px;max-width:46ch}
.files{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.file{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface);flex-wrap:wrap}
.file .ic{width:28px;height:28px;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--ink-2);flex:none;letter-spacing:.02em}
.file .meta{flex:1;min-width:150px}
.file .meta b{display:block;font-size:12.5px;font-weight:500;word-break:break-all}
.file .meta span{font-size:11px;color:var(--muted)}
.prog{height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .35s linear}
select{
  font:inherit;font-size:12px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);
  border-radius:6px;padding:5px 8px;max-width:100%
}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rawprev{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow-x:auto;font-size:11px;padding:10px}
.rawprev pre{margin:0;font-family:"IBM Plex Mono",monospace;line-height:1.75;white-space:pre;color:var(--ink-2)}
.maprow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.maprow:last-child{border-bottom:0}
.maprow label{font-size:12px;width:112px;flex:none;color:var(--ink-2)}
.maprow select{flex:1;min-width:120px}
.fmtprev{margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--accent-wash);font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line-2);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--surface-3)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.tab .ct{font-variant-numeric:tabular-nums;opacity:.75}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.rtable td{vertical-align:top}
.rtable tr[data-st="dup"] td{opacity:.62}
.rtable tr[data-st="attn"]{background:var(--warn-chip)}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:1px 0 0}
.issuerow td{padding-top:0}
.issue{padding:11px 13px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);display:flex;flex-direction:column;gap:9px}
.issue .cands{flex-direction:row;flex-wrap:wrap}
.issue .cand{width:auto;flex:1 1 220px}
.issue .hd{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.cands{display:flex;flex-direction:column;gap:5px}
.cand{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:5px;padding:6px 9px;text-align:left;width:100%;font-size:11.5px}
.cand:hover{border-color:var(--accent);background:var(--accent-wash)}
.cand b{font-weight:600}
.cand .m{margin-left:auto;color:var(--muted);font-size:10.5px;white-space:nowrap}
.kest{display:flex;gap:4px;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--muted)}
.commitbar{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap;border-radius:0 0 var(--r) var(--r)}
.done{display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 20px;text-align:center}
.done .tick{width:40px;height:40px;border-radius:50%;background:var(--pos-chip);display:grid;place-items:center;color:var(--pos);margin-bottom:4px}
.done b{font-size:16px;font-weight:600}
.done p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:50ch}
.batches{display:flex;flex-direction:column}
.batch{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:12.5px}
.batch:last-child{border-bottom:0}
.batch .bm{flex:1;min-width:160px}
.batch .bm span{display:block;font-size:11px;color:var(--muted)}

/* ---------- accounts / settings ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.acct{padding:15px 16px;display:flex;flex-direction:column;gap:3px}
.acct .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.acct .v{font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
.acct .mt{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;flex-direction:column;gap:2px}
.srow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srow:last-child{border-bottom:0}
.srow .lab{width:190px;flex:none}
.srow .lab b{display:block;font-size:12.5px;font-weight:500}
.srow .lab span{font-size:11px;color:var(--muted)}
.danger{border-color:var(--neg)!important}
.danger .phead{border-color:var(--neg)}

/* ---------- responsive ---------- */
@media (max-width:900px){ .grid2{grid-template-columns:1fr} .mapgrid{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{
    position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;
    border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
    z-index:40;justify-content:space-around;overflow-x:auto
  }
  .brand,.navhead{display:none}
  .nav{flex-direction:column;gap:3px;font-size:10px;padding:5px 7px;text-align:center;min-width:56px}
  .nav .badge{position:absolute;margin:0;transform:translate(15px,-4px)}
  .nav{position:relative}
  .main{padding-bottom:64px}
  .topbar{padding:9px 16px}
  .content{padding:16px}
  .total{font-size:29px}
  .stats{margin-left:0;gap:18px}
  table{font-size:12px}
}
</style>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand"><span class="mark"><span>DL</span></span><b>Depot&nbsp;Ledger</b></div>
    <div class="navhead">Portfolio</div>
    <button class="nav" data-view="dashboard" aria-current="page"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 11.5 6 7l3 2.5L14 4"/><path d="M2 14h12"/></svg>Dashboard</button>
    <button class="nav" data-view="holdings"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 6.5h12M6 6.5V13"/></svg>Holdings</button>
    <button class="nav" data-view="transactions"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h10M3 5l2.5-2.5M13 11H3m10 0-2.5 2.5"/></svg>Transactions</button>
    <div class="navhead">Data</div>

<script>
"use strict";
/* ===================== weekly value / contribution series ===================== */
const ANCHORS = [
  ["2021-01-04",12000,12150],["2021-04-05",18000,19100],["2021-07-05",24000,26200],["2021-10-04",30000,32900],
  ["2022-01-03",36500,38200],["2022-04-04",43000,40900],["2022-07-04",49500,42500],["2022-10-03",56000,47000],
  ["2023-01-02",62500,58500],["2023-04-03",69000,68900],["2023-07-03",75500,77400],["2023-10-02",82000,81300],
  ["2024-01-01",88500,94600],["2024-04-01",95000,104200],["2024-07-01",101500,112800],["2024-09-30",108000,119400],
  ["2025-01-06",114500,128900],["2025-04-07",121000,130200],["2025-07-07",128000,148600],["2025-10-06",134500,157300],
  ["2026-01-05",141000,168400],["2026-04-06",145500,174900],["2026-07-06",147500,185200],["2026-09-21",CONTRIB,TOTAL],
];
const SERIES = (() => {
  const A = ANCHORS.map(([d,c,v]) => [new Date(d+"T00:00:00Z").getTime(), c, v]);
  const out = [], WK = 7*864e5, end = A[A.length-1][0];
  let t = A[0][0], i = 0, k = 0;
  while (t <= end) {
    while (i < A.length-2 && t > A[i+1][0]) i++;
    const [t0,c0,v0] = A[i], [t1,c1,v1] = A[i+1];
    const f = Math.min(1,Math.max(0,(t-t0)/(t1-t0)));
    const jitter = 1 + 0.013*Math.sin(k*1.71) + 0.008*Math.sin(k*0.53+1.2) + 0.005*Math.sin(k*3.1);
    out.push({t, c: Math.round((c0+(c1-c0)*f)/50)*50, v: (v0+(v1-v0)*f)*jitter});
    t += WK; k++;
  }
  const last = A[A.length-1];
  out.push({t:last[0], c:last[1], v:last[2]});
  return out;
})();

const RANGES = [
  {k:"1M",  d:31},  {k:"6M", d:183}, {k:"YTD", ytd:true},
  {k:"1J",  d:365}, {k:"5J", d:1826}, {k:"MAX", all:true},
];
const NOW = SERIES[SERIES.length-1].t;
function sliceSeries(r){
  if (r.all) return SERIES;
  const from = r.ytd ? new Date("2026-01-01T00:00:00Z").getTime() : NOW - r.d*864e5;
  const s = SERIES.filter(p => p.t >= from);
  return s.length > 2 ? s : SERIES.slice(-3);
}
const fmtDate = t => new Date(t).toLocaleDateString("de-DE",{day:"2-digit",month:"short",year:"numeric"});

/* ============================== chart ============================== */
function drawChart(host, pts){
  const W = Math.max(300, host.clientWidth), H = W < 520 ? 190 : 250;
  const padL = W < 520 ? 44 : 56, padR = 14, padT = 14, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB;
  const vals = pts.flatMap(p => [p.v, p.c]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.12 || 1; lo = Math.max(0, lo - pad); hi = hi + pad;
  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), nrm = raw / mag;
  const step = (nrm <= 1 ? 1 : nrm <= 2 ? 2 : nrm <= 2.5 ? 2.5 : nrm <= 5 ? 5 : 10) * mag;
  lo = Math.max(0, Math.floor(lo / step) * step); hi = Math.ceil(hi / step) * step;
  const X = i => padL + (i/(pts.length-1))*iw;
  const Y = v => padT + ih - ((v - lo)/(hi - lo))*ih;
  const tickLabel = v => v >= 1000
    ? "€" + (v/1000).toLocaleString("de-DE",{maximumFractionDigits:1}) + "k"
    : "€" + v.toLocaleString("de-DE",{maximumFractionDigits:0});

  const line = key => pts.map((p,i) => (i?"L":"M") + X(i).toFixed(1) + " " + Y(p[key]).toFixed(1)).join(" ");
  const area = key => line(key) + ` L ${X(pts.length-1).toFixed(1)} ${(padT+ih).toFixed(1)} L ${padL} ${(padT+ih).toFixed(1)} Z`;

  const gy = [];
  for (let v = lo; v <= hi + step/2; v += step){
    gy.push(`<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W-padR}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-8}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${tickLabel(v)}</text>`);
  }
  const years = new Map();
  pts.forEach((p,i) => { const y = new Date(p.t).getUTCFullYear(); if(!years.has(y)) years.set(y,i); });
  const spanDays = (pts[pts.length-1].t - pts[0].t)/864e5;
  let gx = "";
  if (spanDays > 400){
    gx = [...years].slice(spanDays > 1500 ? 0 : 1).map(([y,i]) =>
      `<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${y}</text>`).join("");
  } else {
    gx = [0, Math.floor(pts.length/2), pts.length-1].map(i =>
      `<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${new Date(pts[i].t).toLocaleDateString("de-DE",{month:"short",year:"2-digit"})}</text>`).join("");
  }
  const lastX = X(pts.length-1), lastY = Y(pts[pts.length-1].v);

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Portfolio value against net contributions, ${fmtDate(pts[0].t)} to ${fmtDate(pts[pts.length-1].t)}">
    ${gy.join("")}
    <path d="${area("c")}" fill="var(--band-fill)"/>
    <path d="${line("c")}" fill="none" stroke="var(--band)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="${area("v")}" fill="var(--accent-wash)"/>
    <path d="${line("v")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <g id="cross" opacity="0">
      <line y1="${padT}" y2="${padT+ih}" stroke="var(--line-2)" stroke-width="1"/>
      <circle r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
      <circle r="3.5" fill="var(--band)" stroke="var(--surface)" stroke-width="2"/>
    </g>
    ${gx}
  </svg>`;
  return {X,Y,pts,padL,iw,W,H};
}

function wireChart(host, tip, geo){
  const svg = host.querySelector("svg"), cross = svg.querySelector("#cross");
  const [vline, vdot, cdot] = [cross.children[0], cross.children[1], cross.children[2]];
  const move = e => {
    const r = svg.getBoundingClientRect();
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const x = px * (geo.W / r.width);
    let i = Math.round(((x - geo.padL)/geo.iw) * (geo.pts.length-1));
    i = Math.max(0, Math.min(geo.pts.length-1, i));
    const p = geo.pts[i], cx = geo.X(i);
    cross.setAttribute("opacity","1");
    vline.setAttribute("x1",cx); vline.setAttribute("x2",cx);
    vdot.setAttribute("cx",cx); vdot.setAttribute("cy",geo.Y(p.v));
    cdot.setAttribute("cx",cx); cdot.setAttribute("cy",geo.Y(p.c));
    const gain = p.v - p.c;
    tip.hidden = false;
    tip.innerHTML = `<div class="t">${fmtDate(p.t)}</div>
      <div class="r"><span><i class="sw" style="background:var(--accent)"></i>Value</span><b>${EUR(p.v)}</b></div>
      <div class="r"><span><i class="sw" style="background:var(--band)"></i>Contributed</span><b>${EUR(p.c)}</b></div>
      <div class="r" style="margin-top:4px;padding-top:4px;border-top:1px solid var(--line)"><span>Gain</span><b class="${gain>=0?"pos":"neg"}">${money(gain)}</b></div>`;
    const left = Math.min(Math.max(8, (cx/geo.W)*r.width - tip.offsetWidth/2), r.width - tip.offsetWidth - 8);
    tip.style.left = left + "px"; tip.style.top = "6px";
  };
  const leave = () => { cross.setAttribute("opacity","0"); tip.hidden = true; };
  svg.addEventListener("mousemove", move);
  svg.addEventListener("mouseleave", leave);
  svg.addEventListener("touchstart", move, {passive:true});
  svg.addEventListener("touchmove", move, {passive:true});
  svg.addEventListener("touchend", leave);
}

function spark(tk, up){
  let seed = 0; for (const ch of tk) seed += ch.charCodeAt(0);
  const n = 26, pts = [];
  for (let i = 0; i < n; i++){
    const drift = (up ? 1 : -1) * (i/n) * 9;
    pts.push(50 - drift + 6*Math.sin(i*0.9 + seed) + 3.5*Math.sin(i*2.3 + seed*0.7));
  }
  const lo = Math.min(...pts), hi = Math.max(...pts);
  const d = pts.map((v,i) => (i?"L":"M") + (i/(n-1)*70+1).toFixed(1) + " " + (20 - ((v-lo)/((hi-lo)||1))*18 + 1).toFixed(1)).join(" ");
  return `<svg width="72" height="22" viewBox="0 0 72 22" aria-hidden="true"><path d="${d}" fill="none"
    stroke="${up?"var(--pos)":"var(--neg)"}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
</script>

    <div class="pbody batches">
      ${BATCHES.map(b=>`<div class="batch">
        <span class="chip neutral">${b.src}</span>
        <span class="bm"><b class="mono" style="font-weight:500">${b.n}</b><span>${b.when} · ${b.stat}</span></span>
        <button class="btn ghost">Revert</button>
      </div>`).join("")}
    </div>
  </div>`;
}

function issuePanel(r){
  if (r.fix === "isin") return `<div class="issue">
    <div class="hd"><b>Link this security</b></div>
    <div class="cands">
      ${CANDIDATES.map((x,n)=>`<button class="cand" data-resolve="${r.i}" data-cand="${n}">
        <b>${x.n}</b><span class="mono" style="color:var(--muted)">${x.tk} · ${x.ex} · ${x.ccy}</span>
        <span class="m">${x.m}% match</span></button>`).join("")}
      <button class="cand" data-resolve="${r.i}" data-cand="manual"><b>Create manually</b>
        <span class="m">no price feed</span></button>
    </div>
    <div style="font-size:10.5px;color:var(--muted)">Two listings, one ISIN — the app will not pick for you.</div>
  </div>`;
  if (r.fix === "fx") return `<div class="issue">
    <div class="hd"><b>Missing FX rate</b></div>
    <button class="btn" data-resolve="${r.i}" data-cand="fx" style="align-self:flex-start">Fetch ECB rate for 12.08.2026</button>
  </div>`;
  return `<div class="issue">
    <div class="hd"><b>Austrian accumulating-fund tax</b></div>
    <div style="font-size:11px;color:var(--ink-2)">Record it as a tax charge so the cash balance stays right. v1 does not interpret it further.</div>
    <button class="btn" data-resolve="${r.i}" data-cand="age" style="align-self:flex-start">Import as TAX · €48,20</button>
  </div>`;
}
</script>
<script>
"use strict";
/* ============================== accounts + settings ============================== */
function vAccounts(){
  return `
  <div><h1>Accounts</h1>
  <p class="lede">One row per broker account. Archive rather than delete, so history survives closing an account.</p></div>
  <div class="cards">
    ${ACCOUNTS.map(a=>`<div class="panel acct">
      <div class="nm">${a.n}<span class="chip neutral">${a.t}</span></div>
      <div class="v">${EUR(a.v)}</div>
      <div class="mt">
        <span>${(a.v/TOTAL*100).toFixed(1)} % of portfolio · ${a.ccy}</span>
        <span>${a.tx} transactions</span>
        <span>Last import: ${a.last}</span>
      </div>
    </div>`).join("")}
    <button class="panel acct" style="align-items:center;justify-content:center;color:var(--muted);border-style:dashed;gap:6px">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
      Add account
    </button>
  </div>`;
}

function vSettings(){
  const row = (b,s,ctl) => `<div class="srow"><span class="lab"><b>${b}</b><span>${s}</span></span>${ctl}</div>`;
  return `
  <div><h1>Settings</h1>
  <p class="lede">Single user, self-hosted. Backup and restore is a shipped feature here, not a documented command.</p></div>
  <div class="panel">
    <div class="phead"><h2>Portfolio</h2></div>
    <div class="pbody" style="padding-top:2px">
      ${row("Base currency","Every value is converted to this","<select><option>EUR — Euro</option><option>CHF</option><option>USD</option></select>")}
      ${row("Cost basis method","Changes lots and realised gains","<select><option>FIFO</option><option>Average cost</option></select>")}
      ${row("Capital gains tax","Austrian KESt, withheld at source by flatex.at and DADAT","<select><option>27,5 % KESt (Austria)</option><option>None</option></select>")}
      ${row("Benchmark","Shown alongside your return","<select><option>MSCI World (IE00B4L5Y983)</option><option>ATX</option><option>None</option></select>")}
    </div>
  </div>
  <div class="panel">
    <div class="phead"><h2>Market data</h2></div>
    <div class="pbody" style="padding-top:2px">
      ${row("Price provider","Swappable — free feeds change terms without notice","<select><option>Yahoo Finance</option><option>Twelve Data</option><option>stooq</option></select>")}
      ${row("FX rates","Daily reference rates, carried forward over weekends","<select><option>ECB (free, no key)</option></select>")}
      ${row("Fetch schedule","Runs whether or not a browser is open",
        `<select><option>Daily, 22:15 after close</option><option>Hourly</option></select><button class="btn">Run now</button>`)}
    </div>
  </div>
  <div class="panel">
    <div class="phead"><h2>Data</h2></div>
    <div class="pbody" style="padding-top:2px">
      ${row("Backup","Full JSON + CSV export of the ledger, securities and prices",
        `<button class="btn">Download backup</button><button class="btn">Restore…</button>`)}
      ${row("Trash","Deleted transactions are restorable for 30 days","<button class=\"btn\">View trash (4)</button>")}
    </div>
  </div>
  <div class="panel danger">
    <div class="phead"><h2 style="color:var(--neg)">Danger zone</h2></div>
    <div class="pbody" style="padding-top:2px">
      ${row("Wipe all data","Removes every transaction, security and cached price","<button class=\"btn\" style=\"color:var(--neg);border-color:var(--neg)\">Wipe…</button>")}
    </div>
  </div>`;
}

/* ============================== router + wiring ============================== */
const VIEWS = {dashboard:vDashboard, holdings:vHoldings, transactions:vTransactions, import:vImport, accounts:vAccounts, settings:vSettings};
let ro = null, parseTimer = null;

function render(){
  document.querySelectorAll(".nav").forEach(b => {
    if (b.dataset.view === S.view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  document.getElementById("navBadge").textContent = counts().attn;
  document.getElementById("navBadge").hidden = counts().attn === 0;
  el.innerHTML = VIEWS[S.view]();
  if (ro){ ro.disconnect(); ro = null; }
  if (S.view === "dashboard") mountChart();
  if (S.view === "import" && S.step === 2) runParse();
}

function mountChart(){
  const host = document.getElementById("chart"), tip = document.getElementById("tip");
  const paint = () => {
    const geo = drawChart(host, sliceSeries(RANGES.find(r => r.k === S.range)));
    wireChart(host, tip, geo);
  };
  paint();
  let lastW = host.clientWidth;
  ro = new ResizeObserver(() => {
    const w = host.clientWidth;
    if (Math.abs(w - lastW) < 2) return;   // width-only: never loop on our own height change
    lastW = w; paint();
  });
  ro.observe(document.getElementById("chartwrap"));
}

function runParse(){
  clearInterval(parseTimer);
  if (S.parse >= 100) return;
  parseTimer = setInterval(() => {
    S.parse = Math.min(100, S.parse + 7);
    if (S.view === "import" && S.step === 2) render();
    if (S.parse >= 100) clearInterval(parseTimer);
  }, 130);
}

/* range control */
const seg = document.getElementById("rangeSeg");
seg.innerHTML = RANGES.map(r => `<button data-range="${r.k}" aria-pressed="${S.range===r.k}">${r.k}</button>`).join("");
seg.addEventListener("click", e => {
  const b = e.target.closest("[data-range]"); if (!b) return;
  S.range = b.dataset.range;
  seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.range === S.range)));
  if (S.view === "dashboard") render();
});

/* nav */
document.querySelector(".rail").addEventListener("click", e => {
  const b = e.target.closest(".nav"); if (!b) return;
  S.view = b.dataset.view; render(); window.scrollTo({top:0});
});

/* theme */
const themeBtn = document.getElementById("themeBtn"), themeLabel = document.getElementById("themeLabel");
const sysDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
let stamped = null;
try { stamped = localStorage.getItem("dl-theme"); } catch {}
if (stamped) document.documentElement.setAttribute("data-theme", stamped);
const syncLabel = () => {
  const dark = stamped ? stamped === "dark" : sysDark();
  themeLabel.textContent = dark ? "Light" : "Dark";
};
syncLabel();
themeBtn.addEventListener("click", () => {
  const dark = stamped ? stamped === "dark" : sysDark();
  stamped = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", stamped);
  try { localStorage.setItem("dl-theme", stamped); } catch {}
  syncLabel();
  if (S.view === "dashboard") render();
});

/* delegated content interactions */
el.addEventListener("click", e => {
  const lot = e.target.closest("[data-lot]");
  if (lot){ const k = lot.dataset.lot; S.open.has(k) ? S.open.delete(k) : S.open.add(k); return render(); }

  const step = e.target.closest("[data-step]");
  if (step){ S.step = +step.dataset.step; return render(); }

  const go = e.target.closest("[data-go]");
  if (go){ S.step = +go.dataset.go; return render(); }

  const vgo = e.target.closest("[data-view-go]");
  if (vgo){ S.view = vgo.dataset.viewGo; return render(); }

  const f = e.target.closest("[data-filter]");
  if (f){ S.filter = f.dataset.filter; return render(); }

  const res = e.target.closest("[data-resolve]");
  if (res){
    const r = S.rows.find(x => x.i === +res.dataset.resolve), c = res.dataset.cand;
    if (c === "fx"){ r.net = "131,35"; r.gr = "€980,00 → €131,35"; r.tax = "35,47"; r.issue = "Converted at 7,4612 DKK/EUR (ECB, 12.08.2026)"; }
    else if (c === "age"){ r.issue = "Recorded as a tax charge — not interpreted further"; }
    else if (c === "manual"){ r.s = "Manual security"; r.issue = "Created manually — no price feed, value must be entered by hand"; }
    else { const x = CANDIDATES[+c]; r.s = x.tk; r.isin = "US0378331005"; r.issue = `Linked to ${x.n} · ${x.ex} · ${x.ccy}`; }
    r.st = "new"; r.on = true; r.fix = null;
    return render();
  }

  if (e.target.id === "commitBtn"){
    S.committed = counts().on; S.step = 5; return render();
  }
  if (e.target.closest("#undoBtn")){
    S.rows = REVIEW.map(r => ({...r, on: r.st === "new"}));
    S.committed = 0; S.step = 4; S.filter = "all"; return render();
  }
});

el.addEventListener("change", e => {
  if (e.target.id === "allChk"){
    const shown = S.rows.filter(r => S.filter === "all" || r.st === S.filter);
    const on = e.target.checked;
    shown.forEach(r => { if (r.st !== "attn") r.on = on; });
    return render();
  }
  const row = e.target.closest("[data-row]");
  if (row){
    const r = S.rows.find(x => x.i === +row.dataset.row);
    r.on = row.checked; return render();
  }
});

/* keyboard: j/k through holdings is a stated goal; here, 1-6 jump views */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  const keys = Object.keys(VIEWS);
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= keys.length){ S.view = keys[n-1]; render(); }
});

render();
</script>
