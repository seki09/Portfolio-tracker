/* ============================ base ============================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0; background:var(--md-sys-color-surface); color:var(--md-sys-color-on-surface);
  font-family:var(--md-ref-typeface-plain); font-size:var(--md-sys-typescale-body-medium-size);
  line-height:var(--md-sys-typescale-body-medium-line-height); letter-spacing:var(--md-sys-typescale-body-medium-tracking);
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;font-variant-numeric:inherit}
select,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:500}
:focus-visible{outline:3px solid var(--md-sys-color-secondary);outline-offset:2px}
.mono{font-family:var(--app-typeface-mono);letter-spacing:0}
.pos{color:var(--app-color-gain)} .neg{color:var(--app-color-loss)}
.muted{color:var(--md-sys-color-on-surface-variant)}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;
  text-transform:none;white-space:nowrap;direction:ltr;display:inline-block;width:1em;height:1em;overflow:hidden;flex:none;
  -webkit-font-feature-settings:"liga";font-feature-settings:"liga";-webkit-font-smoothing:antialiased;
  font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.ms.sm{font-size:18px} .ms.md{font-size:20px}

/* type-scale utilities (M3 roles) */
.ts-display{font-family:var(--md-ref-typeface-brand);font-size:var(--md-sys-typescale-display-large-size);line-height:var(--md-sys-typescale-display-large-line-height);letter-spacing:var(--md-sys-typescale-display-large-tracking);font-weight:500;font-variation-settings:"ROND" 100}
.ts-hl{font-family:var(--md-ref-typeface-brand);font-size:var(--md-sys-typescale-headline-large-size);line-height:var(--md-sys-typescale-headline-large-line-height);font-weight:500;font-variation-settings:"ROND" 100;letter-spacing:0}

.ts-ts{font-size:var(--md-sys-typescale-title-small-size);line-height:var(--md-sys-typescale-title-small-line-height);letter-spacing:var(--md-sys-typescale-title-small-tracking);font-weight:500}
.ts-bl{font-size:var(--md-sys-typescale-body-large-size);line-height:var(--md-sys-typescale-body-large-line-height);letter-spacing:var(--md-sys-typescale-body-large-tracking);font-weight:400}
.ts-bm{font-size:var(--md-sys-typescale-body-medium-size);line-height:var(--md-sys-typescale-body-medium-line-height);letter-spacing:var(--md-sys-typescale-body-medium-tracking);font-weight:400}
.ts-bs{font-size:var(--md-sys-typescale-body-small-size);line-height:var(--md-sys-typescale-body-small-line-height);letter-spacing:var(--md-sys-typescale-body-small-tracking);font-weight:400}
.ts-ll{font-size:var(--md-sys-typescale-label-large-size);line-height:var(--md-sys-typescale-label-large-line-height);letter-spacing:var(--md-sys-typescale-label-large-tracking);font-weight:500}
.ts-lm{font-size:var(--md-sys-typescale-label-medium-size);line-height:var(--md-sys-typescale-label-medium-line-height);letter-spacing:var(--md-sys-typescale-label-medium-tracking);font-weight:500}

/* state layers: hover 8 %, focus / pressed 10 % of the content colour */
.sl{position:relative;isolation:isolate}
.sl::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;pointer-events:none;z-index:-1;
  transition:opacity var(--md-sys-motion-duration-short) linear}
@media (hover:hover){.sl:hover::after{opacity:.08}}
.sl:focus-visible::after,.sl:active::after{opacity:.1}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ============================ shell ============================ */
.app{min-height:100%}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  display:flex; align-items:center; gap:8px; height:var(--topbar-h);
  padding-inline:16px 8px; background:var(--md-sys-color-surface);
  transition:background-color var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized);
}
.topbar.scrolled{background:var(--md-sys-color-surface-container)}
.brandwrap{display:flex;align-items:center;gap:12px;min-width:0}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:var(--md-sys-typescale-title-large-size);line-height:26px;font-weight:600;font-variation-settings:"ROND" 100;letter-spacing:0}
.brand small{font-size:var(--md-sys-typescale-label-medium-size);line-height:16px;letter-spacing:.3px;color:var(--md-sys-color-on-surface-variant);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desksub{display:none}
.spacer{flex:1}
.iconbtn{width:48px;height:48px;display:grid;place-items:center;border-radius:var(--md-sys-shape-corner-full);color:var(--md-sys-color-on-surface-variant);flex:none}
.iconbtn::after{inset:4px}
.assist{display:inline-flex;align-items:center;gap:6px;height:32px;padding-inline:8px 12px;border-radius:var(--md-sys-shape-corner-small);
  border:1px solid var(--md-sys-color-outline-variant);white-space:nowrap;color:var(--md-sys-color-on-surface)}
.assist .ms{color:var(--md-sys-color-primary)}
.assist.demo{border-color:transparent;background:var(--app-color-warn-container);color:var(--app-color-on-warn-container)}
.assist.demo .ms{color:var(--app-color-on-warn-container)}

/* shape-library icon containers (Expressive) */
.shape{position:relative;display:grid;place-items:center;width:var(--sz,40px);height:var(--sz,40px);flex:none;color:var(--sfg)}
.shape svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shape path{fill:var(--sbg)}
.shape > span{position:relative;display:grid;place-items:center}
.shape .glyph{font-weight:700;font-variation-settings:"ROND" 100;font-size:calc(var(--sz,40px) * .42);line-height:1;letter-spacing:0}

.rail{display:none}
main.content{
  width:100%; max-width:1200px; margin-inline:auto;
  padding-inline:16px; padding-block:4px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:16px;
}
main.content.enter > *{animation:enter var(--md-sys-motion-duration-long) var(--md-sys-motion-easing-emphasized-decelerate) both}
main.content.enter > :nth-child(2){animation-delay:30ms} main.content.enter > :nth-child(3){animation-delay:60ms}
main.content.enter > :nth-child(n+4){animation-delay:90ms}
@keyframes enter{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}

/* navigation bar (M3 Expressive, flexible) */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:grid; grid-template-columns:repeat(5,minmax(0,1fr));
  padding-bottom:env(safe-area-inset-bottom,0px); background:var(--md-sys-color-surface-container);
}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:var(--nav-h);position:relative;
  color:var(--md-sys-color-on-surface-variant);font-size:var(--md-sys-typescale-label-medium-size);line-height:16px;letter-spacing:.5px;font-weight:500;min-width:0}
.tab .ic{position:relative;width:56px;height:32px;border-radius:var(--md-sys-shape-corner-full);display:grid;place-items:center;isolation:isolate}
.tab .ic::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--md-sys-color-secondary-container);transform:scaleX(0);opacity:0;z-index:-1}
.tab .ic::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;z-index:-1;transition:opacity var(--md-sys-motion-duration-short)}
@media (hover:hover){.tab:hover .ic::after{opacity:.08}}
.tab:active .ic::after{opacity:.1}
.tab:focus-visible{outline:none} .tab:focus-visible .ic{outline:3px solid var(--md-sys-color-secondary);outline-offset:2px}
.tab[aria-current="page"]{color:var(--md-sys-color-secondary);font-weight:600}
.tab[aria-current="page"] .ic{color:var(--md-sys-color-on-secondary-container)}
.tab[aria-current="page"] .ic::before{transform:none;opacity:1;animation:pill var(--md-sys-motion-duration-medium) var(--md-sys-motion-spring-fast-spatial)}
.tab[aria-current="page"] .ms{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
@keyframes pill{from{transform:scaleX(.3);opacity:.4}to{transform:none;opacity:1}}
.badge{position:absolute;top:-4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:var(--md-sys-shape-corner-full);
  background:var(--md-sys-color-error);color:var(--md-sys-color-on-error);font-size:11px;line-height:16px;font-weight:600;text-align:center;letter-spacing:0}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:260px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;padding:12px 12px 20px;background:var(--md-sys-color-surface)}
  .rail .brandrow{display:flex;align-items:center;gap:12px;padding:8px 12px 24px}
  .navitem{display:flex;align-items:center;gap:12px;height:56px;padding-inline:16px 20px;border-radius:var(--md-sys-shape-corner-full);
    color:var(--md-sys-color-on-surface-variant);font-size:var(--md-sys-typescale-label-large-size);letter-spacing:.1px;font-weight:500}
  .navitem[aria-current="page"]{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);font-weight:600;

<script>
"use strict";
/* ============================== data ============================== */
const P = window.PORTFOLIO || window.PORTFOLIO_DEMO;
const T = P.totals;
const IS_DEMO = !!P.meta.isDemo;
const SERIES = P.series.map(([d, v, c]) => ({ t: Date.parse(d + "T00:00:00Z"), d, v, c })).filter((p, i, a) => i === 0 || p.t > a[i - 1].t);
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
P.holdings.forEach((h, i) => { h.color = COLORS[i] || "var(--md-sys-color-outline)"; });

/* ============================== format ============================== */
const nf2 = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf1 = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 0 });
const nfq = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 4 });
const NB = " ";
const eur = n => "€" + NB + nf2.format(n);
const eur0 = n => "€" + NB + nf0.format(n);
const eurS = n => (n < 0 ? "−" : "+") + "€" + NB + nf2.format(Math.abs(n));
const pct = (n, d = 1) => (n < 0 ? "−" : "+") + (d === 1 ? nf1 : nf2).format(Math.abs(n)) + NB + "%";
const arrow = n => (n < 0 ? "▼" : "▲");
const cls = n => (n < 0 ? "neg" : "pos");
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD = d => { const [y, m, dd] = d.slice(0, 10).split("-"); return `${+dd} ${MONTHS[+m - 1]} ${y}`; };
const fmtMY = d => { const [y, m] = d.slice(0, 7).split("-"); return `${MONTHS[+m - 1]} ${y}`; };
const fmtTime = iso => { const t = new Date(iso); return isNaN(t) ? "" : t.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const monogram = name => {
  const w = name.replace(/^Core\s+/i, "").replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : (w[0] || "?").slice(0, 2)).toUpperCase();
};
const exchangeName = x => ({ langschwarz: "Lang & Schwarz", xetra: "Xetra", frankfurt: "Frankfurt", tradegate: "Tradegate", nasdaq: "Nasdaq", nyse: "NYSE" })[x] || x;
const toast = msg => {
  const host = document.getElementById("toastHost");
  host.innerHTML = `<div class="toast ts-bm" role="status">${msg}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { host.innerHTML = ""; }, 4200);
};

/* Material Symbols (Rounded); names must also be listed in the font link's icon_names */
const ICON = { overview: "monitoring", holdings: "pie_chart", activity: "receipt_long", import: "download", more: "more_horiz",
  moon: "dark_mode", sun: "light_mode", buy: "add", sell: "remove", dividend: "payments", info: "info", chev: "chevron_right" };
const ms = (name, c = "") => `<span class="ms${c ? " " + c : ""}" aria-hidden="true">${name}</span>`;

/* M3 Expressive shape library: cookie / clover / sunny / burst, drawn from a polar formula */
const SHAPES = { cookie9: [9, 0.07], clover4: [4, 0.16], sunny8: [8, 0.055], burst12: [12, 0.05], cookie6: [6, 0.09] };
const shapeCache = {};
function shapePath(k) {
  if (shapeCache[k]) return shapeCache[k];
  const [n, a] = SHAPES[k]; let d = "";
  for (let i = 0; i <= 180; i++) {
    const th = (i / 180) * Math.PI * 2, r = 50 * (1 - a + a * Math.cos(n * th));
    d += (i ? "L" : "M") + (50 + r * Math.sin(th)).toFixed(2) + " " + (50 - r * Math.cos(th)).toFixed(2);
  }
  return (shapeCache[k] = d + "Z");
}
const shape = (k, bg, fg, inner, px = 40) =>
  `<span class="shape" style="--sz:${px}px;--sbg:var(${bg});--sfg:var(${fg})"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="${shapePath(k)}"/></svg><span>${inner}</span></span>`;

/* ============================== chart ============================== */
const RANGE_KEYS = ["1M", "6M", "YTD", "1Y", "5Y", "MAX"];
function rangeStart(k) {
  const end = SERIES[SERIES.length - 1].t, d = new Date(end);
  if (P.ranges?.[k]?.start) return Date.parse(P.ranges[k].start + "T00:00:00Z");
  if (k === "MAX") return SERIES[0].t;
  if (k === "YTD") return Date.UTC(d.getUTCFullYear(), 0, 1);
  const m = { "1M": 1, "6M": 6, "1Y": 12, "5Y": 60 }[k];
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - m, d.getUTCDate());
}
function seriesFor(k) {
  const from = rangeStart(k);
  let i = SERIES.findIndex(p => p.t >= from);
  if (i < 0) i = SERIES.length - 2;
  if (i > 0 && SERIES[i].t > from) i--;                 // carry the last known value into the window
  const pts = SERIES.slice(Math.max(0, i));
  // trim the empty prehistory (portfolio worth 0 before the first trade)
  const firstNZ = pts.findIndex(p => p.v > 0 || p.c > 0);
  return firstNZ > 0 ? pts.slice(firstNZ - 1) : pts;
}
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), r = raw / mag;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(v);
  return { ticks: out, lo: a, hi: b };
}
const tickLabel = v => v >= 1000 ? "€" + nf0.format(v / 1000) + "k" : "€" + nf0.format(v);

function drawChart(host, pts) {
  const W = Math.max(280, Math.round(host.clientWidth)), H = W < 560 ? 200 : 260;
  const padT = 12, padB = 26, ih = H - padT - padB;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const vals = pts.flatMap(p => [p.v, p.c]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.1 || 1;
  const nt = niceTicks(Math.max(0, lo - pad), hi + pad, 3);
  lo = nt.lo; hi = nt.hi;
  const X = t => 10 + ((t - t0) / ((t1 - t0) || 1)) * (W - 20);
  const Y = v => padT + ih - ((v - lo) / ((hi - lo) || 1)) * ih;
  const path = key => pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p[key]).toFixed(1)).join("");
  const area = key => path(key) + `L${X(t1).toFixed(1)} ${padT + ih}L${X(t0).toFixed(1)} ${padT + ih}Z`;
  const grid = nt.ticks.map(v => `
    <line class="gl" x1="10" x2="${W - 10}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>
    <text x="12" y="${(Y(v) - 5).toFixed(1)}">${tickLabel(v)}</text>`).join("");
  // x labels: years for long spans, months otherwise — 3 to 5 labels, never colliding
  const spanD = (t1 - t0) / 864e5, xl = [];
  if (spanD > 700) {
    const y0 = new Date(t0).getUTCFullYear() + 1, y1 = new Date(t1).getUTCFullYear(), every = Math.ceil((y1 - y0 + 1) / (W < 560 ? 4 : 7));
    for (let y = y0; y <= y1; y += every) xl.push([Date.UTC(y, 0, 1), String(y)]);
  } else {
    const n = W < 560 ? 3 : 5;
    for (let i = 0; i < n; i++) { const t = t0 + (i / (n - 1)) * (t1 - t0); xl.push([t, fmtD(new Date(t).toISOString()).replace(/^\d+ /, "")]); }
  }
  const xlab = xl.map(([t, s]) => {
    const x = X(t), anchor = x < 30 ? "start" : x > W - 30 ? "end" : "middle";
    return `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${s}</text>`;
  }).join("");
  const lp = pts[pts.length - 1];
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Portfolio value and invested capital, ${fmtD(pts[0].d)} to ${fmtD(lp.d)}">
    <defs><linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--md-sys-color-primary);stop-opacity:.30"/><stop offset="1" style="stop-color:var(--md-sys-color-primary);stop-opacity:0"/></linearGradient></defs>
    ${grid}
    <path d="${area("v")}" style="fill:url(#gv)"/>
    <path class="inv" d="${path("c")}"/>
    <path class="val" d="${path("v")}"/>
    <circle class="dot" cx="${X(lp.t).toFixed(1)}" cy="${Y(lp.v).toFixed(1)}" r="5.5"/>
    <g id="scrub" opacity="0">
      <line class="xl" y1="${padT}" y2="${padT + ih}"/>
      <circle class="dot" r="6"/>
      <circle class="dotc" r="5"/>
    </g>
    ${xlab}
  </svg>`;
  return { X, Y, pts, W };
}

function wireScrub(host, geo, readout, idle) {
  const svg = host.querySelector("svg"), g = svg.querySelector("#scrub");
  const [ln, dv, dc] = g.children;
  const at = clientX => {
    const r = svg.getBoundingClientRect(), x = (clientX - r.left) * (geo.W / r.width);
    const pts = geo.pts;
    let lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (geo.X(pts[m].t) < x) lo = m; else hi = m; }
    const p = Math.abs(geo.X(pts[lo].t) - x) < Math.abs(geo.X(pts[hi].t) - x) ? pts[lo] : pts[hi];
    const cx = geo.X(p.t);
    g.setAttribute("opacity", "1");
    ln.setAttribute("x1", cx); ln.setAttribute("x2", cx);
    dv.setAttribute("cx", cx); dv.setAttribute("cy", geo.Y(p.v));
    dc.setAttribute("cx", cx); dc.setAttribute("cy", geo.Y(p.c));
    readout.innerHTML = `<b>${fmtD(p.d)}</b><span><i class="key"></i>Value ${eur(p.v)}</span><span><i class="key inv"></i>Invested ${eur(p.c)}</span>`;
  };
  let hold = 0;
  const end = () => { clearTimeout(hold); g.setAttribute("opacity", "0"); readout.innerHTML = idle; };
  host.onpointerdown = e => { clearTimeout(hold); at(e.clientX); };
  host.onpointermove = e => { if (e.pointerType === "mouse" || e.buttons || e.pressure > 0) at(e.clientX); };
  // touch: a tap is the natural phone gesture, so the value stays readable after the finger lifts
  host.onpointerup = e => { if (e.pointerType !== "mouse") { clearTimeout(hold); hold = setTimeout(end, 2500); } };
  host.onpointerleave = e => { if (e.pointerType === "mouse") end(); };
  host.onpointercancel = end;   // vertical scroll took over the gesture
}
</script>
<script>
"use strict";
/* ============================== state ============================== */
const S = { view: "overview", range: "MAX", hfilter: "open", afilter: "all", apage: 60, open: new Set(), imp: null };

const divRows = P.ledger.filter(l => l.type === "DIVIDEND");
const countOf = t => P.sync?.counts?.[t] ?? P.ledger.filter(l => l.type === t.toUpperCase()).length;
const sinceY = (P.meta.since || SERIES[0].d).slice(0, 4);
const austriaBasis = P.holdings.reduce((s, h) => s + (h.costAustria ?? h.cost), 0);

/* ---------- shared pieces ---------- */
function totalMarkup(v) {
  const [i, c] = nf2.format(v).split(",");
  return `<span class="cur">€</span>${i}<span class="cents">,${c}</span>`;
}
function holdingCard(h, compact) {
  const open = !compact && S.open.has(h.id), w = h.value / T.value * 100;
  return `<article class="hcard${open ? " open" : ""}" style="--c:${h.color}">
    <button class="hmain sl" data-hold="${esc(h.id)}" aria-expanded="${open}">
      <span class="avatar" aria-hidden="true">${monogram(h.name)}</span>

function vActivity() {

  for (const r of shown) {

      html += `<div class="mgroup"><div class="monthhead ts-ts"><span>${fmtMY(r.d)}</span><span>${eurS(mt)}</span></div><div class="seglist">`;

      ? `${fmtD(r.d)} · gross ${eur(r.gross)}${r.tax ? ` · tax ${eur(r.tax)}` : ""}`
      : `${fmtD(r.d)} · ${nfq.format(r.shares)} @ ${eur(r.price)}`;

      <span class="aamt"><b class="${r.net > 0 ? "pos" : ""}">${eurS(r.net)}</b><span class="ts-bs">${r.type === "BUY" ? "Buy" : r.type === "SELL" ? "Sell" : "Dividend"}${r.fee ? ` · fee ${eur(r.fee)}` : ""}</span></span></div>`;
  }
  if (month) html += `</div></div>`;
  return `

  <div class="sumrow">

    ${[["all", "All", P.ledger.length], ["buy", "Buys", countOf("buy")], ["sell", "Sells", countOf("sell")], ["dividend", "Dividends", countOf("dividend")]]
      .map(([k, l, n]) => `<button class="fchip sl" data-afilter="${k}" aria-pressed="${S.afilter === k}">${S.afilter === k ? ms("check") : ""}${l}<span class="ct">${n}</span></button>`).join("")}

  ${rows.length > shown.length ? `<button class="btn tonal block sl" data-more="1">Show ${Math.min(60, rows.length - shown.length)} more · ${rows.length - shown.length} left</button>` : ""}`;
}

04.07.2026;04.07.2026;Dividende;AT0000743059;;;0,00;39,05;102,95</pre></div>
        <div class="fmt ts-bm"><b>Preview</b><span class="mono">1.512,30</span>→<span class="mono">1512.30</span><span class="mono">02.07.2026</span>→<span class="mono">2026-07-02</span></div>
        <div class="mapgrid">${[["Execution date", "Buchungstag"], ["Settlement date", "Valuta"], ["Type", "Text"], ["ISIN", "ISIN"], ["Quantity", "Stück"], ["Fee", "Spesen"], ["Tax (KESt)", "KESt"], ["Net amount", "Betrag"]]
          .map(([k, v]) => `<div class="maprow"><label class="ts-bm" for="map-${v}">${k}</label><select id="map-${v}"><option>${v}</option><option>— not mapped —</option></select></div>`).join("")}
          <div class="maprow"><label class="ts-bm" for="fmt-dec">Number format</label><select id="fmt-dec"><option>1.234,56 (AT/DE)</option><option>1,234.56 (US/UK)</option></select></div>
        </div>
        <div class="btnrow" style="padding:4px 0 0"><button class="btn outlined sl" data-imp="1">Back</button><button class="btn filled sl" data-imp="3">Parse 9 rows</button></div></div>`;
    if (I.step === 3) {
      const shown = I.rows.filter(r => I.filter === "all" || r.st === I.filter);
      body = `<div class="cardbody" style="padding-bottom:12px"><div class="chips" style="margin:0;padding:0;flex-wrap:wrap;overflow:visible">${[["all", "All"], ["new", "New"], ["dup", "Duplicates"], ["attn", "Needs attention"]]
          .map(([k, l]) => `<button class="fchip sl" data-ifilter="${k}" aria-pressed="${I.filter === k}">${I.filter === k ? ms("check") : ""}${l}<span class="ct">${c[k]}</span></button>`).join("")}</div></div>
        <div class="rlist seglist">${shown.map(r => `<div class="rcard" data-st="${r.st}">
          <input type="checkbox" class="cbx" id="irow-${r.i}" data-irow="${r.i}" ${r.on ? "checked" : ""} ${r.st === "attn" ? "disabled" : ""} aria-label="Include ${esc(r.s)} on ${r.d}">
          <span class="t"><b>${esc(r.s)}</b><span class="ts-bs">${fmtD(r.d)} · ${r.t}${r.lbl ? " · " + esc(r.lbl) : ""}</span>
            ${r.isin ? `<span class="ts-bs mono">${r.isin}${r.q ? " · " + r.q : ""}</span>` : ""}
            ${r.tax ? `<span class="ts-bs">gross ${eur(r.gross)} · KESt ${eur(r.tax)}</span>` : ""}
            ${r.issue ? `<span class="ts-bs issue">${esc(r.issue)}</span>` : ""}</span>
          <span class="a ts-bm ${r.net > 0 ? "pos" : ""}">${eurS(r.net)}</span>
          ${r.st === "attn" ? `<div class="fix">${r.fix === "isin"
            ? `<button class="cand sl" data-fix="${r.i}" data-c="MSFT · Nasdaq · USD"><b>Microsoft</b><span class="mono ts-bs">MSFT · Nasdaq · USD</span><span class="m ts-ll">98%</span></button>
               <button class="cand sl" data-fix="${r.i}" data-c="MSF · Xetra · EUR"><b>Microsoft</b><span class="mono ts-bs">MSF · Xetra · EUR</span><span class="m ts-ll">91%</span></button>`
            : `<button class="cand sl" data-fix="${r.i}" data-c="tax"><b>Import as tax charge</b><span class="m ts-ll">keeps cash right</span></button>`}</div>` : ""}
        </div>`).join("")}</div>
        <div class="btnrow"><button class="btn outlined sl" data-imp="2">Back</button><button class="btn filled sl" data-imp="commit" ${c.on ? "" : "disabled"}>Import ${c.on}</button></div>`;
    }
    if (I.step === 4) body = `<div class="donebox">${shape("burst12", "--app-color-gain-container", "--app-color-on-gain-container", `<span class="ms fill" style="font-size:36px">check</span>`, 80)}
        <b class="ts-hs">${I.done} transactions imported</b>
        <p class="ts-bm">Example only. Your ledger is unchanged. A real import is one batch you can undo at any time.</p></div>
        <div class="btnrow" style="max-width:460px;margin-inline:auto"><button class="btn outlined sl" data-imp="undo">${ms("undo")}Undo import</button><button class="btn filled sl" data-imp="cancel">Done</button></div>`;
    flow = steps + body;
  }
  return `
  <header class="pagehead"><h1 class="ts-hl">Import</h1>
    <p class="ts-bl">Connected sources sync automatically. Broker files go through review first, so nothing reaches the ledger unseen.</p></header>
  ${sourceCard}
  <section class="card"><div class="cardhead"><h2 class="ts-tl">Import a file</h2>${I ? `<span class="chip warn act">Example</span>` : `<span class="sub ts-bm">CSV · XLSX · PDF</span>`}</div>${flow}</section>`;
}

/* ============================== more ============================== */
function vMore() {
  const theme = currentThemeSetting();
  const diff = austriaBasis - T.invested;
  return `
  <header class="pagehead"><h1 class="ts-hl">More</h1><p class="ts-bl">Account, cost basis, appearance and where your data lives.</p></header>
  <section class="card">
    <div class="source">${shape("cookie9", "--md-sys-color-primary-container", "--md-sys-color-on-primary-container", `<span class="glyph">${esc(P.meta.portfolio.name.slice(0, 1))}</span>`, 56)}
      <div><h3 class="ts-tl">${esc(P.meta.portfolio.name)}</h3><p class="ts-bm">${IS_DEMO ? "Demo depot" : "Synced from Parqet"} · ${P.meta.currency} · since ${fmtD(P.meta.since || SERIES[0].d)}</p></div></div>
    <div class="statgrid" style="padding-bottom:20px">
      <div><b>${eur0(T.value)}</b><small class="ts-bs">value</small></div><div><b>${P.holdings.length}</b><small class="ts-bs">open</small></div><div><b>${P.ledger.length}</b><small class="ts-bs">activities</small></div>
    </div>
  </section>
  <section class="card">
    <div class="cardhead"><h2 class="ts-tl">Cost basis</h2></div>
    <div class="settings seglist">
      <div class="srow"><div class="lead">${ms("calculate")}<div><b>${esc(T.costBasisMethod || "FIFO")}</b><p class="ts-bm">Matches Parqet, so gains agree with what you see there.</p></div></div>
        <select id="costMethod" aria-label="Cost basis method"><option>FIFO, fees excluded</option><option>Moving average, fees excluded (AT KESt)</option></select></div>
    </div>
    ${Math.abs(diff) >= 0.01 ? `<div style="padding:0 12px 12px"><div class="note ts-bm">${ms(ICON.info)}<span>For Austrian KESt, privately held securities use <b>moving average, fees excluded</b>. Your basis would be <b>${eur(austriaBasis)}</b>, ${eurS(diff)} against FIFO.</span></div></div>` : ""}
  </section>
  <section class="card">
    <div class="cardhead"><h2 class="ts-tl">Appearance</h2></div>
    <div class="cardbody"><div class="cbg" role="group" aria-label="Theme">
      ${[["system", "System"], ["light", "Light"], ["dark", "Dark"]].map(([k, l]) => `<button class="sl" data-theme-set="${k}" aria-pressed="${theme === k}">${theme === k ? ms("check") : ""}${l}</button>`).join("")}</div></div>
  </section>
  <section class="card">
    <div class="cardhead"><h2 class="ts-tl">Data & privacy</h2></div>
    <div class="settings seglist">
      <div class="srow"><div class="lead">${ms("lock")}<div><b>${IS_DEMO ? "Demo snapshot" : "Local snapshot"}</b><p class="ts-bm">${IS_DEMO
        ? "Fictional data shipped with the repository."
        : "Lives in <span class='mono'>portfolio.local.js</span>, which is gitignored. The repository is public, so personal data never goes into it."}</p></div></div>
        <span class="chip ${IS_DEMO ? "warn" : "tonal"}" style="justify-self:start">${IS_DEMO ? "Demo" : "Private"}</span></div>
      <div class="srow"><div class="lead">${ms("monitoring")}<div><b>Prices</b><p class="ts-bm">Last quotes from ${exchangeName(P.holdings[0]?.quote?.exchange || "—")} · ${fmtTime(P.meta.asOf)}</p></div></div></div>
    </div>
  </section>`;
}

/* ============================== theme ============================== */
const root = document.documentElement;
const sysDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
function currentThemeSetting() { try { return localStorage.getItem("dl-theme") || "system"; } catch { return "system"; } }
function applyTheme(mode) {
  if (mode === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", mode);
  try { localStorage.setItem("dl-theme", mode); } catch {}
  const dark = mode === "dark" || (mode === "system" && sysDark());
  const btn = document.getElementById("themeBtn");
  btn.innerHTML = ms(dark ? ICON.sun : ICON.moon);
  btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}

/* ============================== router ============================== */
const VIEWS = { overview: vOverview, holdings: vHoldings, activity: vActivity, import: vImport, more: vMore };
const NAV = [["overview", "Overview"], ["holdings", "Holdings"], ["activity", "Activity"], ["import", "Import"], ["more", "More"]];
const view = document.getElementById("view");
let ro = null, lastW = 0;

function renderNav() {
  const bad = (P.sync?.reconcile || []).filter(c => !c.ok).length;
  document.getElementById("bottomNav").innerHTML = NAV.map(([k, l]) => `<a class="tab" href="#${k}" ${S.view === k ? 'aria-current="page"' : ""}>
    <span class="ic">${ms(ICON[k])}${k === "import" && bad ? `<span class="badge">${bad}</span>` : ""}</span>${l}</a>`).join("");
  document.getElementById("railNav").innerHTML = NAV.map(([k, l]) => `<a class="navitem sl" href="#${k}" ${S.view === k ? 'aria-current="page"' : ""}>
    ${ms(ICON[k])}${l}${k === "import" && bad ? `<span class="cnt">${bad}</span>` : ""}</a>`).join("");
}
function render() {
  renderNav();
  view.innerHTML = VIEWS[S.view]();
  if (ro) { ro.disconnect(); ro = null; }
  if (S.view === "overview") mountHero();
}
function mountHero() {
  const host = document.getElementById("chart"), readout = document.getElementById("readout");
  const idle = readout.innerHTML;
  const paint = () => wireScrub(host, drawChart(host, seriesFor(S.range)), readout, idle);
  paint(); lastW = host.clientWidth;
  ro = new ResizeObserver(() => { const w = host.clientWidth; if (Math.abs(w - lastW) >= 2) { lastW = w; paint(); } });
  ro.observe(host);
}
function route() {
  const k = (location.hash || "#overview").slice(1);
  S.view = VIEWS[k] ? k : "overview";
  render(); window.scrollTo({ top: 0 });
  view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter");
}

/* ============================== events ============================== */
view.addEventListener("click", e => {
  const q = sel => e.target.closest(sel);
  let el;
  if ((el = q("[data-range]"))) { S.range = el.dataset.range; return render(); }
  if ((el = q("[data-hold]"))) { const id = el.dataset.hold; if (S.view !== "holdings") { S.open.add(id); S.hfilter = "open"; location.hash = "#holdings"; return; } S.open.has(id) ? S.open.delete(id) : S.open.add(id); return render(); }
  if ((el = q("[data-hf]"))) { S.hfilter = el.dataset.hf; return; }
  if ((el = q("[data-hfilter]"))) { S.hfilter = el.dataset.hfilter; return render(); }
  if ((el = q("[data-afilter]"))) { S.afilter = el.dataset.afilter; S.apage = 60; return render(); }
  if ((el = q("[data-more]"))) { S.apage += 60; return render(); }
  if ((el = q("[data-theme-set]"))) { applyTheme(el.dataset.themeSet); return render(); }
  if ((el = q("[data-sync]"))) return toast("Ask Claude to “sync Parqet”. It captures fresh payloads and runs tools/parqet-import, then this page shows the new snapshot.");
  if ((el = q("[data-howsync]"))) return toast("Parqet → raw payloads (gitignored) → convert.mjs rebuilds lots, applies splits, reconciles → portfolio.local.js.");
  if ((el = q("[data-broker]"))) { S.imp = newImport(el.dataset.broker); return render(); }
  if ((el = q("[data-ifilter]"))) { S.imp.filter = el.dataset.ifilter; return render(); }
  if ((el = q("[data-fix]"))) {
    const r = S.imp.rows.find(x => x.i === +el.dataset.fix), c = el.dataset.c;
    if (c === "tax") r.issue = "Recorded as a tax charge"; else { r.s = "Microsoft"; r.issue = "Linked to " + c; }
    r.st = "new"; r.on = true; r.fix = null; return render();
  }
  if ((el = q("[data-imp]"))) {
    const a = el.dataset.imp;
    if (a === "cancel") S.imp = null;
    else if (a === "commit") { S.imp.done = icount(S.imp.rows).on; S.imp.step = 4; }
    else if (a === "undo") { const b = S.imp.broker; S.imp = newImport(b); S.imp.step = 3; toast("Import undone. The batch was removed in one step."); }
    else S.imp.step = +a;
    return render();
  }
});
view.addEventListener("change", e => {
  const r = e.target.closest("[data-irow]");
  if (r) { S.imp.rows.find(x => x.i === +r.dataset.irow).on = r.checked; render(); }
});
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.getAttribute("data-theme") === "dark" || (!root.hasAttribute("data-theme") && sysDark());
  applyTheme(dark ? "light" : "dark"); if (S.view === "more") render();
});
window.addEventListener("hashchange", route);
window.addEventListener("scroll", () => document.getElementById("topbar").classList.toggle("scrolled", window.scrollY > 4), { passive: true });

/* ============================== boot ============================== */
const mark = shape("sunny8", "--md-sys-color-primary-container", "--md-sys-color-on-primary-container", ms("monitoring", "md fill"), 40);
document.getElementById("topMark").outerHTML = mark;
document.getElementById("railMark").outerHTML = mark;
document.getElementById("topSub").textContent = document.getElementById("railSub").textContent = `${P.meta.portfolio.name} · ${eur0(T.value)}`;
document.getElementById("deskSub").textContent = `${P.meta.portfolio.name} · ${eur(T.value)}`;
document.getElementById("srcLabel").textContent = IS_DEMO ? "Demo data" : "Parqet";
document.getElementById("srcIcon").textContent = IS_DEMO ? "science" : "cloud_done";
document.getElementById("srcPill").classList.toggle("demo", IS_DEMO);
document.getElementById("railFoot").innerHTML = IS_DEMO ? "Demo data, fictional." : `Synced from Parqet<br>${fmtTime(P.meta.convertedAt || P.meta.asOf)}`;
applyTheme(currentThemeSetting());
route();
</script>
