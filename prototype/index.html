<title>Depot Ledger</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400..500&family=Google+Sans+Flex:opsz,wght@6..144,300..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..600,0..1,0&icon_names=add,calculate,check,check_circle,chevron_right,cloud_done,dark_mode,description,download,error,expand_more,help,info,light_mode,lock,monitoring,more_horiz,payments,picture_as_pdf,pie_chart,priority_high,receipt_long,remove,science,sync,undo,upload_file,warning&display=block">
<style>
/* =====================================================================
   Material 3, monochrome. Colour roles generated with
   @material/material-color-utilities: SchemeMonochrome, spec 2025,
   contrast 0 (true neutral greys, primary = ink). Colour on the page
   comes only from the holding palette (c1–c5, validated), the semantic
   gain / loss / warn roles, and the chart.
   Layout: plain surface, hairline dividers, one hero number. Components
   reflow with container queries sized in em/rem, so larger Android font
   sizes and narrower display sizes rearrange instead of breaking.
   ===================================================================== */
:root{
  --md-sys-color-primary:#000000; --md-sys-color-on-primary:#e2e2e2;
  --md-sys-color-primary-container:#3b3b3b; --md-sys-color-on-primary-container:#ffffff;
  --md-sys-color-secondary:#5e5e5e; --md-sys-color-on-secondary:#ffffff;
  --md-sys-color-secondary-container:#d4d4d4; --md-sys-color-on-secondary-container:#1b1b1b;
  --md-sys-color-error:#ba1a1a; --md-sys-color-on-error:#ffffff;
  --md-sys-color-error-container:#ffdad6; --md-sys-color-on-error-container:#410002;
  --md-sys-color-surface:#f9f9f9; --md-sys-color-surface-bright:#f9f9f9; --md-sys-color-surface-dim:#dadada;
  --md-sys-color-surface-container-lowest:#ffffff; --md-sys-color-surface-container-low:#f3f3f3;
  --md-sys-color-surface-container:#eeeeee; --md-sys-color-surface-container-high:#e8e8e8;
  --md-sys-color-surface-container-highest:#e2e2e2;
  --md-sys-color-on-surface:#1b1b1b; --md-sys-color-on-surface-variant:#474747;
  --md-sys-color-outline:#777777; --md-sys-color-outline-variant:#c6c6c6;
  --md-sys-color-inverse-surface:#303030; --md-sys-color-inverse-on-surface:#f1f1f1; --md-sys-color-inverse-primary:#c6c6c6;
  /* semantic (status only): gain = M3 custom colour from #1e9e4a, loss = error role */
  --app-color-gain:#006e2e; --app-color-loss:#ba1a1a; --app-color-warn:#7f5700;
  /* holdings: categorical, fixed order; validated on #f9f9f9 (light) and #131313 (dark) */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#6250d6; --c5:#e87ba4;
  /* chart */
  --app-chart-area:rgba(0,0,0,.045);

  --md-sys-shape-corner-extra-small:4px; --md-sys-shape-corner-small:8px; --md-sys-shape-corner-medium:12px;
  --md-sys-shape-corner-large:16px; --md-sys-shape-corner-extra-large:28px; --md-sys-shape-corner-full:999px;
  --md-ref-typeface-plain:"Google Sans Flex","Google Sans","Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  --app-typeface-mono:"Google Sans Code","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  --md-sys-motion-easing-emphasized:cubic-bezier(.2,0,0,1);
  --md-sys-motion-easing-emphasized-decelerate:cubic-bezier(.05,.7,.1,1);
  --md-sys-motion-spring-fast-spatial:cubic-bezier(.34,1.36,.64,1);
  --topbar-h:64px; --nav-h:72px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --md-sys-color-primary:#ffffff; --md-sys-color-on-primary:#1b1b1b;
  --md-sys-color-primary-container:#d4d4d4; --md-sys-color-on-primary-container:#000000;
  --md-sys-color-secondary:#c6c6c6; --md-sys-color-on-secondary:#1b1b1b;
  --md-sys-color-secondary-container:#474747; --md-sys-color-on-secondary-container:#e2e2e2;
  --md-sys-color-error:#ffb4ab; --md-sys-color-on-error:#690005;
  --md-sys-color-error-container:#93000a; --md-sys-color-on-error-container:#ffdad6;
  --md-sys-color-surface:#131313; --md-sys-color-surface-bright:#393939; --md-sys-color-surface-dim:#131313;
  --md-sys-color-surface-container-lowest:#0e0e0e; --md-sys-color-surface-container-low:#1b1b1b;
  --md-sys-color-surface-container:#1f1f1f; --md-sys-color-surface-container-high:#2a2a2a;
  --md-sys-color-surface-container-highest:#353535;
  --md-sys-color-on-surface:#e2e2e2; --md-sys-color-on-surface-variant:#c6c6c6;
  --md-sys-color-outline:#919191; --md-sys-color-outline-variant:#474747;
  --md-sys-color-inverse-surface:#e2e2e2; --md-sys-color-inverse-on-surface:#303030; --md-sys-color-inverse-primary:#5e5e5e;
  --app-color-gain:#68de81; --app-color-loss:#ffb4ab; --app-color-warn:#ffba3b;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#9085e9; --c5:#d55181;
  --app-chart-area:rgba(255,255,255,.05);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --md-sys-color-primary:#ffffff; --md-sys-color-on-primary:#1b1b1b;
  --md-sys-color-primary-container:#d4d4d4; --md-sys-color-on-primary-container:#000000;
  --md-sys-color-secondary:#c6c6c6; --md-sys-color-on-secondary:#1b1b1b;
  --md-sys-color-secondary-container:#474747; --md-sys-color-on-secondary-container:#e2e2e2;
  --md-sys-color-error:#ffb4ab; --md-sys-color-on-error:#690005;
  --md-sys-color-error-container:#93000a; --md-sys-color-on-error-container:#ffdad6;
  --md-sys-color-surface:#131313; --md-sys-color-surface-bright:#393939; --md-sys-color-surface-dim:#131313;
  --md-sys-color-surface-container-lowest:#0e0e0e; --md-sys-color-surface-container-low:#1b1b1b;
  --md-sys-color-surface-container:#1f1f1f; --md-sys-color-surface-container-high:#2a2a2a;
  --md-sys-color-surface-container-highest:#353535;
  --md-sys-color-on-surface:#e2e2e2; --md-sys-color-on-surface-variant:#c6c6c6;
  --md-sys-color-outline:#919191; --md-sys-color-outline-variant:#474747;
  --md-sys-color-inverse-surface:#e2e2e2; --md-sys-color-inverse-on-surface:#303030; --md-sys-color-inverse-primary:#5e5e5e;
  --app-color-gain:#68de81; --app-color-loss:#ffb4ab; --app-color-warn:#ffba3b;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#9085e9; --c5:#d55181;
  --app-chart-area:rgba(255,255,255,.05);
  color-scheme:dark;
}

/* ============================ base ============================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0; background:var(--md-sys-color-surface); color:var(--md-sys-color-on-surface);
  font-family:var(--md-ref-typeface-plain); font-size:14px; line-height:1.45; letter-spacing:.015em;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;font-variant-numeric:inherit;text-align:inherit}
select,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,dl,dd,ol{margin:0}
:focus-visible{outline:3px solid var(--md-sys-color-on-surface);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--app-typeface-mono);letter-spacing:0}
.nw{white-space:nowrap}
.pos{color:var(--app-color-gain)} .neg{color:var(--app-color-loss)} .warn{color:var(--app-color-warn)}
.muted{color:var(--md-sys-color-on-surface-variant)}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;
  text-transform:none;white-space:nowrap;direction:ltr;display:inline-block;width:1em;height:1em;overflow:hidden;flex:none;
  font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.ms.sm{font-size:18px} .ms.md{font-size:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* M3 type roles */
.t-title-l{font-size:22px;line-height:1.27;font-weight:500;letter-spacing:0}
.t-title-m{font-size:16px;line-height:1.5;font-weight:500;letter-spacing:.01em}
.t-title-s{font-size:14px;line-height:1.43;font-weight:500;letter-spacing:.007em}
.t-body-l{font-size:16px;line-height:1.5;letter-spacing:.015em}
.t-body-m{font-size:14px;line-height:1.43;letter-spacing:.018em}
.t-body-s{font-size:12px;line-height:1.33;letter-spacing:.03em}
.t-label-l{font-size:14px;line-height:1.43;font-weight:500;letter-spacing:.007em}
.t-label-m{font-size:12px;line-height:1.33;font-weight:500;letter-spacing:.04em}

/* state layers: hover 8 %, focus / pressed 10 % of the content colour */
.sl{position:relative;isolation:isolate}
.sl::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;pointer-events:none;z-index:-1;transition:opacity .15s linear}
@media (hover:hover){.sl:hover::after{opacity:.08}}
.sl:focus-visible::after,.sl:active::after{opacity:.1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ============================ shell ============================ */
.app{min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:4px;min-height:var(--topbar-h);
  padding-inline:16px 4px;background:var(--md-sys-color-surface);container:topbar / inline-size;
  transition:background-color .3s var(--md-sys-motion-easing-emphasized)}
.topbar.scrolled{background:var(--md-sys-color-surface-container)}
.screen-title{flex:1 1 auto;min-width:0;white-space:nowrap}
.assist{display:inline-flex;align-items:center;gap:6px;height:32px;padding-inline:8px 12px;border-radius:var(--md-sys-shape-corner-small);
  border:1px solid var(--md-sys-color-outline-variant);white-space:nowrap;flex:none}
.assist.demo .ms{color:var(--app-color-warn)}
@container topbar (max-width:25em){ .assist{width:40px;height:40px;padding:0;justify-content:center;border-radius:50%} .assist .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)} }
.iconbtn{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;color:var(--md-sys-color-on-surface-variant);flex:none}
.iconbtn::after{inset:4px}
.rail{display:none}
main.content{width:100%;max-width:1040px;margin-inline:auto;padding-inline:16px;
  padding-block:4px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:36px}
main.content.enter > *{animation:enter .45s var(--md-sys-motion-easing-emphasized-decelerate) both}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

/* navigation bar: labels only on the selected item when the bar gets narrow (font size up or display size up) */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--md-sys-color-surface-container);container:nav / inline-size;font-size:12px}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:var(--nav-h);
  color:var(--md-sys-color-on-surface-variant);font-weight:500;letter-spacing:.04em;line-height:1.33}
.tab .ic{position:relative;width:56px;height:32px;border-radius:var(--md-sys-shape-corner-full);display:grid;place-items:center;isolation:isolate;flex:none}
.tab .ic::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--md-sys-color-secondary-container);transform:scaleX(0);opacity:0;z-index:-1}
.tab .ic::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;z-index:-1;transition:opacity .15s}
@media (hover:hover){.tab:hover .ic::after{opacity:.08}}
.tab:active .ic::after{opacity:.1}
.tab:focus-visible{outline:none} .tab:focus-visible .ic{outline:3px solid var(--md-sys-color-on-surface);outline-offset:2px}
.tab .lbl{white-space:nowrap}
.tab[aria-current="page"]{color:var(--md-sys-color-on-surface);font-weight:700}
.tab[aria-current="page"] .ic{color:var(--md-sys-color-on-secondary-container)}
.tab[aria-current="page"] .ic::before{transform:none;opacity:1;animation:pill .3s var(--md-sys-motion-spring-fast-spatial)}
.tab[aria-current="page"] .ms{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
@keyframes pill{from{transform:scaleX(.3);opacity:.4}to{transform:none;opacity:1}}
@container nav (max-width:30em){
  .tab:not([aria-current="page"]) .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tab[aria-current="page"]{flex-grow:1.8}
}
.badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--md-sys-color-error);color:var(--md-sys-color-on-error);font-size:11px;line-height:16px;font-weight:600;text-align:center;letter-spacing:0}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:248px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;padding:16px 12px 20px;background:var(--md-sys-color-surface);border-right:1px solid var(--md-sys-color-outline-variant)}
  .rail .brandrow{display:flex;align-items:center;gap:12px;padding:6px 12px 24px}
  .mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);flex:none}
  .navitem{display:flex;align-items:center;gap:12px;min-height:56px;padding-inline:16px 20px;border-radius:var(--md-sys-shape-corner-full);color:var(--md-sys-color-on-surface-variant);font-weight:500}
  .navitem[aria-current="page"]{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);font-weight:700}
  .navitem[aria-current="page"] .ms{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
  .navitem .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--md-sys-color-error);color:var(--md-sys-color-on-error);font-size:11px;line-height:20px;font-weight:600;text-align:center}
  .rail .foot{margin-top:auto;padding:0 16px;color:var(--md-sys-color-on-surface-variant)}
  .bottomnav{display:none}
  .topbar{padding-inline:32px 20px}
  .screen-title{font-size:28px;line-height:1.3}
  main.content{margin-inline:0;padding-inline:32px;padding-block:8px 56px;gap:44px}
}

/* ============================ primitives ============================ */
.sec{display:flex;flex-direction:column;gap:12px;min-width:0;container-type:inline-size}
.sechead{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 12px}
.sechead .sub{color:var(--md-sys-color-on-surface-variant)}
.sechead .act{margin-left:auto}
.lead-p{color:var(--md-sys-color-on-surface-variant);max-width:62ch;margin-top:-20px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--md-sys-color-outline-variant)}
.list > *{border-bottom:1px solid var(--md-sys-color-outline-variant)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:var(--md-sys-shape-corner-small);border:1px solid currentColor;
  font-size:12px;line-height:1.4;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.tag .ms{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:var(--md-sys-shape-corner-full);
  font-size:14px;font-weight:600;letter-spacing:.007em;white-space:nowrap;text-align:center;transition:border-radius .3s var(--md-sys-motion-spring-fast-spatial)}
.btn:active:not([disabled]){border-radius:var(--md-sys-shape-corner-medium)}
.btn .ms{font-size:20px}
.btn.filled{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.btn.outlined{border:1px solid var(--md-sys-color-outline-variant);color:var(--md-sys-color-on-surface)}
.btn.tonal{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.btn.text{padding:0 12px;color:var(--md-sys-color-primary);background:transparent}
.btn[disabled]{background:color-mix(in srgb,var(--md-sys-color-on-surface) 10%,transparent);color:color-mix(in srgb,var(--md-sys-color-on-surface) 38%,transparent);cursor:not-allowed;border-color:transparent}
.btn[disabled]::after{display:none}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto;padding-inline:20px}
.link{display:inline-flex;align-items:center;gap:2px;min-height:48px;padding:0 4px 0 8px;border-radius:var(--md-sys-shape-corner-full);
  font-weight:600;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--md-sys-color-outline-variant);text-underline-offset:4px}
.link .ms{font-size:20px}
/* connected button group: wraps into two rows of three when its container is narrow */
.cbgwrap{container-type:inline-size}
.cbg{display:flex;gap:2px}
.cbg button{flex:1 1 0;min-width:0;min-height:48px;padding:0 4px;border-radius:var(--md-sys-shape-corner-small);white-space:nowrap;
  background:var(--md-sys-color-surface-container);color:var(--md-sys-color-on-surface);font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  transition:border-radius .3s var(--md-sys-motion-spring-fast-spatial),background-color .15s linear}
.cbg button:first-child{border-top-left-radius:var(--md-sys-shape-corner-full);border-bottom-left-radius:var(--md-sys-shape-corner-full)}
.cbg button:last-child{border-top-right-radius:var(--md-sys-shape-corner-full);border-bottom-right-radius:var(--md-sys-shape-corner-full)}
.cbg button[aria-pressed="true"]{background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);border-radius:var(--md-sys-shape-corner-full)}
.cbg button:active{border-radius:var(--md-sys-shape-corner-extra-small)}
.cbg button .ms{font-size:18px}
@container (max-width:19em){
  .cbg.six{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .cbg.six button,.cbg.six button:first-child,.cbg.six button:last-child{border-radius:var(--md-sys-shape-corner-small)}
  .cbg.six button[aria-pressed="true"]{border-radius:var(--md-sys-shape-corner-full)}
}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding-inline:16px;border-radius:var(--md-sys-shape-corner-small);white-space:nowrap;
  border:1px solid var(--md-sys-color-outline-variant);color:var(--md-sys-color-on-surface-variant);font-weight:500}
.fchip[aria-pressed="true"]{padding-inline:10px 16px;border-color:transparent;background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);font-weight:600}
.fchip .ct{opacity:.7}
.fchip .ms{font-size:18px}
/* label / value rows: the value never breaks; it moves under the label when there is no room */
.stat{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 16px;padding-block:12px}
.stat dt{color:var(--md-sys-color-on-surface-variant);white-space:nowrap}
.stat dd{font-weight:600;white-space:nowrap;margin-left:auto}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--md-sys-shape-corner-medium);border:1px solid var(--md-sys-color-outline-variant);color:var(--md-sys-color-on-surface-variant)}
.note .ms{font-size:20px;color:var(--md-sys-color-on-surface)}
.note b{color:var(--md-sys-color-on-surface);font-weight:600}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px));z-index:60;margin-inline:auto;max-width:560px;min-height:48px;
  display:flex;align-items:center;padding:14px 16px;border-radius:var(--md-sys-shape-corner-extra-small);background:var(--md-sys-color-inverse-surface);color:var(--md-sys-color-inverse-on-surface);

const SERIES = P.series.map(([d, v, c]) => ({ t: Date.parse(d + "T00:00:00Z"), d, v, c })).filter((p, i, a) => i === 0 || p.t > a[i - 1].t);
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
P.holdings.forEach((h, i) => { h.color = COLORS[i] || "var(--md-sys-color-outline)"; });

/* ============================== format ============================== */
const nf2 = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf1 = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 0 });
const nfq = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 4 });
const NB = " ";
const eur = n => "€" + NB + nf2.format(n);
const eur0 = n => "€" + NB + nf0.format(n);
const eurS = n => (n < 0 ? "−" : "+") + "€" + NB + nf2.format(Math.abs(n));
const pct = (n, d = 1) => (n < 0 ? "−" : "+") + (d === 1 ? nf1 : nf2).format(Math.abs(n)) + NB + "%";
const arrow = n => (n < 0 ? "▼" : "▲");
const cls = n => (n < 0 ? "neg" : "pos");
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD = d => { const [y, m, dd] = d.slice(0, 10).split("-"); return `${+dd}${NB}${MONTHS[+m - 1]}${NB}${y}`; };
const fmtMY = d => { const [y, m] = d.slice(0, 7).split("-"); return `${MONTHS[+m - 1]} ${y}`; };
const fmtTime = iso => { const t = new Date(iso); return isNaN(t) ? "" : t.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const monogram = name => {
  const w = name.replace(/^Core\s+/i, "").replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : (w[0] || "?").slice(0, 2)).toUpperCase();
};
const exchangeName = x => ({ langschwarz: "Lang & Schwarz", xetra: "Xetra", frankfurt: "Frankfurt", tradegate: "Tradegate", nasdaq: "Nasdaq", nyse: "NYSE" })[x] || x;
const toast = msg => {
  const host = document.getElementById("toastHost");
  host.innerHTML = `<div class="toast t-body-m" role="status">${msg}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { host.innerHTML = ""; }, 4200);
};
/* a signed change that never breaks: "▲ +12,3 %" */
const chg = (n, text) => `<span class="chg nw ${cls(n)}">${arrow(n)}${NB}${text}</span>`;

/* Material Symbols (Rounded); names must also be listed in the font link's icon_names */
const ICON = { overview: "monitoring", holdings: "pie_chart", activity: "receipt_long", import: "download", more: "more_horiz",
  moon: "dark_mode", sun: "light_mode", buy: "add", sell: "remove", dividend: "payments", info: "info", chev: "chevron_right" };
const ms = (name, c = "") => `<span class="ms${c ? " " + c : ""}" aria-hidden="true">${name}</span>`;

/* ============================== chart ============================== */
const RANGE_KEYS = ["1M", "6M", "YTD", "1Y", "5Y", "MAX"];
function rangeStart(k) {
  const end = SERIES[SERIES.length - 1].t, d = new Date(end);
  if (P.ranges?.[k]?.start) return Date.parse(P.ranges[k].start + "T00:00:00Z");
  if (k === "MAX") return SERIES[0].t;
  if (k === "YTD") return Date.UTC(d.getUTCFullYear(), 0, 1);
  const m = { "1M": 1, "6M": 6, "1Y": 12, "5Y": 60 }[k];
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - m, d.getUTCDate());
}
function seriesFor(k) {
  const from = rangeStart(k);
  let i = SERIES.findIndex(p => p.t >= from);
  if (i < 0) i = SERIES.length - 2;
  if (i > 0 && SERIES[i].t > from) i--;                 // carry the last known value into the window
  const pts = SERIES.slice(Math.max(0, i));
  // trim the empty prehistory (portfolio worth 0 before the first trade)
  const firstNZ = pts.findIndex(p => p.v > 0 || p.c > 0);
  return firstNZ > 0 ? pts.slice(firstNZ - 1) : pts;
}
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), r = raw / mag;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(v);
  return { ticks: out, lo: a, hi: b };
}
const tickLabel = v => v >= 1000 ? "€" + nf0.format(v / 1000) + "k" : "€" + nf0.format(v);

function drawChart(host, pts) {
  const W = Math.max(260, Math.round(host.clientWidth)), H = W < 560 ? 196 : 260;
  const padT = 14, padB = 26, ih = H - padT - padB;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const vals = pts.flatMap(p => [p.v, p.c]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.1 || 1;
  const nt = niceTicks(Math.max(0, lo - pad), hi + pad, 3);
  lo = nt.lo; hi = nt.hi;
  const X = t => 2 + ((t - t0) / ((t1 - t0) || 1)) * (W - 8);
  const Y = v => padT + ih - ((v - lo) / ((hi - lo) || 1)) * ih;
  const path = key => pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p[key]).toFixed(1)).join("");
  const area = key => path(key) + `L${X(t1).toFixed(1)} ${padT + ih}L${X(t0).toFixed(1)} ${padT + ih}Z`;
  const grid = nt.ticks.map((v, i) => `
    <line class="${i ? "gl" : "base"}" x1="0" x2="${W}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>
    ${i ? `<text x="${W}" y="${(Y(v) - 5).toFixed(1)}" text-anchor="end">${tickLabel(v)}</text>` : ""}`).join("");
  // x labels: years for long spans, months otherwise — 3 to 5 labels, never colliding
  const spanD = (t1 - t0) / 864e5, xl = [];
  if (spanD > 700) {
    const y0 = new Date(t0).getUTCFullYear() + 1, y1 = new Date(t1).getUTCFullYear(), every = Math.ceil((y1 - y0 + 1) / (W < 560 ? 4 : 7));
    for (let y = y0; y <= y1; y += every) xl.push([Date.UTC(y, 0, 1), String(y)]);
  } else {
    const n = W < 560 ? 3 : 5;
    for (let i = 0; i < n; i++) { const t = t0 + (i / (n - 1)) * (t1 - t0); xl.push([t, fmtD(new Date(t).toISOString()).replace(/^\d+\s/, "")]); }
  }
  const xlab = xl.map(([t, s]) => {
    const x = X(t), anchor = x < 30 ? "start" : x > W - 30 ? "end" : "middle";
    return `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${s}</text>`;
  }).join("");
  const lp = pts[pts.length - 1];
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Portfolio value and invested capital, ${fmtD(pts[0].d)} to ${fmtD(lp.d)}">
    ${grid}
    <path class="area" d="${area("v")}"/>
    <path class="inv" d="${path("c")}"/>
    <path class="val" d="${path("v")}"/>
    <circle class="dot" cx="${X(lp.t).toFixed(1)}" cy="${Y(lp.v).toFixed(1)}" r="5"/>
    <g id="scrub" opacity="0">
      <line class="xl" y1="${padT}" y2="${padT + ih}"/>
      <circle class="dot" r="6"/>
      <circle class="dotc" r="5"/>
    </g>
    ${xlab}
  </svg>`;
  return { X, Y, pts, W };
}

function wireScrub(host, geo, readout, idle) {
  const svg = host.querySelector("svg"), g = svg.querySelector("#scrub");
  const [ln, dv, dc] = g.children;
  const at = clientX => {
    const r = svg.getBoundingClientRect(), x = (clientX - r.left) * (geo.W / r.width);
    const pts = geo.pts;
    let lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (geo.X(pts[m].t) < x) lo = m; else hi = m; }
    const p = Math.abs(geo.X(pts[lo].t) - x) < Math.abs(geo.X(pts[hi].t) - x) ? pts[lo] : pts[hi];
    const cx = geo.X(p.t);
    g.setAttribute("opacity", "1");
    ln.setAttribute("x1", cx); ln.setAttribute("x2", cx);
    dv.setAttribute("cx", cx); dv.setAttribute("cy", geo.Y(p.v));
    dc.setAttribute("cx", cx); dc.setAttribute("cy", geo.Y(p.c));
    readout.innerHTML = `<b>${fmtD(p.d)}</b><span><i class="key"></i>Value ${eur(p.v)}</span><span><i class="key inv"></i>Invested ${eur(p.c)}</span>`;
  };
  let hold = 0;
  const end = () => { clearTimeout(hold); g.setAttribute("opacity", "0"); readout.innerHTML = idle; };
  host.onpointerdown = e => { clearTimeout(hold); at(e.clientX); };
  host.onpointermove = e => { if (e.pointerType === "mouse" || e.buttons || e.pressure > 0) at(e.clientX); };
  // touch: a tap is the natural phone gesture, so the value stays readable after the finger lifts
  host.onpointerup = e => { if (e.pointerType !== "mouse") { clearTimeout(hold); hold = setTimeout(end, 2500); } };
  host.onpointerleave = e => { if (e.pointerType === "mouse") end(); };
  host.onpointercancel = end;   // vertical scroll took over the gesture
}
</script>
<script>
"use strict";
/* ============================== state ============================== */
const S = { view: "overview", range: "MAX", hfilter: "open", afilter: "all", apage: 60, open: new Set(), imp: null };

const divRows = P.ledger.filter(l => l.type === "DIVIDEND");
const countOf = t => P.ledger.filter(l => l.type === t.toUpperCase()).length;
const sinceY = (P.meta.since || SERIES[0].d).slice(0, 4);
const austriaBasis = P.holdings.reduce((s, h) => s + (h.costAustria ?? h.cost), 0);

/* ---------- shared pieces ---------- */
function totalMarkup(v) {
  const [i, c] = nf2.format(v).split(",");
  return `<span class="cur">€</span>${i}<span class="cents">,${c}</span>`;
}
const stat = (label, value, vcls = "") => `<div class="stat"><dt>${label}</dt><dd class="${vcls}">${value}</dd></div>`;
function holdingCard(h, compact) {
  const open = !compact && S.open.has(h.id), w = h.value / SECV * 100;
  return `<article class="hcard${open ? " open" : ""}" style="--c:${h.color}">
    <button class="hmain sl" data-hold="${esc(h.id)}" aria-expanded="${open}">
      <span class="avatar" aria-hidden="true">${monogram(h.name)}</span>
      <span class="hbody">
        <span class="htop"><span class="hn">${esc(h.name)}</span><span class="hv"><b>${eur(h.value)}</b>${chg(h.unrealized, pct(h.unrealizedPct))}</span></span>
        <span class="hsub t-body-s">${h.kind} · <span class="nw">${nfq.format(h.shares)} × ${eur(h.price)}</span></span>
        <span class="hw t-body-s"><span class="wbar" title="${nf1.format(w)} % of portfolio"><i style="width:${w.toFixed(1)}%;background:${h.color}"></i></span>
          <span class="nw">${nf1.format(w)}${NB}%</span>${ms(compact ? "chevron_right" : "expand_more", "md")}</span>
      </span>
    </button>
    ${open ? holdingDetail(h) : ""}
  </article>`;
}
function holdingDetail(h) {
  const sp = (h.splits || []).map(s => `${s.ratio}:1 split on ${fmtD(s.exDate)}`).join(" · ");
  const at = h.costAustria != null && Math.abs(h.costAustria - h.cost) >= 0.01;
  const f = (k, v, c = "") => `<div><dt class="t-label-m">${k}</dt><dd class="t-title-s ${c}">${v}</dd></div>`;
  return `<div class="hdetail">
    <dl class="facts">
      ${f("Unrealised, after fees", eurS(h.unrealized), cls(h.unrealized))}
      ${f("Cost basis", eur(h.cost))}
      ${f("Avg. cost", eur(h.avg))}
      ${f("Realised", h.realized ? eurS(h.realized) : "—", h.realized ? cls(h.realized) : "")}
      ${f("Dividends, net", h.dividendsNet ? eur(h.dividendsNet) : "—")}
      ${f("Today", h.dayAbs == null ? "—" : chg(h.dayAbs, pct(h.dayPct, 2)))}
      ${f("ISIN", `<span class="mono">${h.isin}</span>`)}
      ${f("Held since", fmtD(h.first))}
    </dl>
    ${h.accounts?.length > 1 ? `<div><div class="lotshead t-label-m"><span class="nw">Held at</span></div><div class="list">${h.accounts.map(a => `<div class="lot"><div class="t-body-m"><span class="d">${esc(a.name)}</span><span class="c">${eur(a.value)}</span></div>
        <div class="t-body-s"><span class="q">${nfq.format(a.shares)} shares</span><span class="g">cost ${eur(a.cost)}</span></div></div>`).join("")}</div></div>` : ""}
    ${at ? `<div class="note t-body-m">${ms(ICON.info)}<span>Austrian KESt basis (moving average, fees excluded) is <b class="nw">${eur(h.costAustria)}</b>, <span class="nw">${eurS(h.costAustria - h.cost)}</span> vs. the FIFO figure above.</span></div>` : ""}
    <div>
      <div class="lotshead t-label-m"><span class="nw">Open lots · FIFO</span>${sp ? `<span class="tag warn">${sp}</span>` : ""}</div>
      <div class="list">${h.lots.map(l => {
        const g = (h.price - l.price) * l.shares;
        return `<div class="lot"><div class="t-body-m"><span class="d">${fmtD(l.date)}${MULTI && l.account ? `<span class="split src">${esc(l.account)}</span>` : ""}</span><span class="c">${eur(l.cost)}</span></div>
          <div class="t-body-s"><span class="q">${nfq.format(l.shares)} @ ${eur(l.price)}</span><span class="g ${cls(g)}">${eurS(g)}</span></div></div>`;
      }).join("")}</div>
    </div>
    <div class="qline t-body-s">Quote ${exchangeName(h.quote?.exchange)} · <span class="nw">${fmtTime(h.quote?.at)}</span> · ${h.trades} activities</div>
  </div>`;
}
function divergingRows(rows) {
  const max = Math.max(...rows.map(r => Math.abs(r.realizedNet)), 1);
  // the value sits in the text row above the bar, so no label can ever run past the track
  return `<div class="list">` + rows.map(r => {
    const w = Math.abs(r.realizedNet) / max * 49, p = r.realizedNet >= 0;
    return `<div class="crow"><div class="crow-top t-body-m"><span>${esc(r.name)}</span><span class="v ${p ? "pos" : "neg"}">${eurS(r.realizedNet).replace(",00", "")}</span></div>
      <span class="div-track" aria-hidden="true"><i class="div-bar ${p ? "p" : "n"}" style="width:${w.toFixed(2)}%"></i></span></div>`;
  }).join("") + `</div>`;
}

/* ============================== accounts, insights, checks ============================== */
const ACCOUNTS = P.meta.portfolio.accounts || [];
const MULTI = ACCOUNTS.length > 1;
// Written by the scheduled agents into this artifact's private data store; absent outside it.
const DB = { ready: false, insights: [], audit: null };
const KIND = { risk: ["Risk", "warning"], cost: ["Costs", "payments"], tax: ["Tax", "receipt_long"], idea: ["Idea", "info"], housekeeping: ["Housekeeping", "check"] };
function insightCard(x) {
  const [label, icon] = KIND[x.kind] || ["Note", "info"];
  return `<article class="insight"><div class="itop t-label-m"><span class="tag">${ms(icon)}${label}</span><span class="muted nw">${x.createdAt ? fmtTime(x.createdAt) : ""}</span></div>
    <h3 class="t-title-m">${esc(x.title || "")}</h3><p class="t-body-m">${esc(x.body || "")}</p>
    ${x.impact ? `<p class="t-body-s impact"><b>Impact</b> ${esc(x.impact)}</p>` : ""}</article>`;
}
function auditLine() {
  const a = DB.audit;
  if (!a) return "";
  const ok = a.status === "pass";
  return `<div class="auditline t-body-s ${ok ? "pos" : "neg"}">${ms(ok ? "check_circle" : "error")}<span>${ok
    ? `Calculations verified <span class="nw">${fmtTime(a.at)}</span> · ${a.passed} checks`
    : `${a.failed} calculation check${a.failed === 1 ? "" : "s"} failed <span class="nw">${fmtTime(a.at)}</span>${a.summary ? " · " + esc(a.summary) : ""}`}</span></div>`;
}
function insightsSection(all) {
  if (!DB.ready) return "";
  const list = all ? DB.insights : DB.insights.slice(0, 3);
  return `<section class="sec" id="insights"><div class="sechead"><h2 class="t-title-l">Insights</h2><span class="sub t-body-m">weekly portfolio review</span>
      ${!all && DB.insights.length > 3 ? `<a class="link act" href="#more">All ${DB.insights.length} ${ms(ICON.chev)}</a>` : ""}</div>
    ${list.length ? `<div class="insights">${list.map(insightCard).join("")}</div>`
      : `<p class="muted t-body-m">No insights yet. The weekly review posts its observations here.</p>`}
    <p class="muted t-body-s">Observations about your own portfolio, not personal financial advice. Nothing is ever traded for you.</p></section>`;
}

/* ============================== overview ============================== */
function vOverview() {
  const R = P.ranges?.[S.range];
  const idle = `<span>Since ${fmtD(P.meta.since || SERIES[0].d)}</span><span>Touch the chart to scrub</span>`;
  const alloc = P.holdings.map(h => ({ name: h.name, v: h.value, color: h.color }));
  const byYear = {};
  divRows.forEach(r => { const y = r.d.slice(0, 4); byYear[y] = (byYear[y] || 0) + r.net; });
  const years = Object.keys(byYear).sort(), ymax = Math.max(...Object.values(byYear), 1);
  const winners = P.closed.filter(c => c.realizedNet > 0).slice(0, 4);
  const losers = P.closed.filter(c => c.realizedNet < 0).slice(-4).reverse();
  const realizedClosed = P.closed.reduce((s, c) => s + c.realizedNet, 0);
  const kpi = (label, value, sub, vcls = "") => `<div class="kpi"><dt class="t-body-m">${label}</dt><dd class="v ${vcls}">${value}</dd><dd class="s t-body-s">${sub}</dd></div>`;
  return `
  <section class="hero" id="hero" aria-label="Portfolio value">
    <div class="hero-label t-label-l">Total value · ${esc(P.meta.portfolio.name)}</div>
    <div class="total" aria-label="${eur(T.value)}">${totalMarkup(T.value)}</div>
    ${T.dayAbs != null ? `<div class="daychg t-body-m">${chg(T.dayAbs, `${eurS(T.dayAbs)} · ${pct(T.dayPct, 2)}`)}<span class="muted">since last close</span></div>` : ""}
    <div class="chartbox" id="chart"></div>
    <div class="readout t-body-s" id="readout">${idle}</div>
    <div class="hlegend t-label-m"><span><i class="key"></i>Portfolio value</span><span><i class="key inv"></i>Invested capital</span></div>
    <div class="cbgwrap"><div class="cbg six t-label-l" role="group" aria-label="Time range">
      ${RANGE_KEYS.map(k => `<button class="sl" data-range="${k}" aria-pressed="${S.range === k}">${k}</button>`).join("")}
    </div></div>
    ${R ? `<dl class="rangesum list t-body-m">
      ${stat("Return · TWR", pct(R.ttwror), cls(R.ttwror))}
      ${stat(`Gain · ${S.range}`, eurS(R.gain).replace(/,\d\d$/, ""), R.gain < 0 ? "neg" : "")}
      ${stat("XIRR p.a.", R.xirr && S.range !== "1M" ? pct(R.xirr) : "—")}
    </dl>` : ""}
  </section>

  <section class="sec" aria-label="Key figures">
    <dl class="kpis">
      ${kpi("Invested", eur(T.invested), `${P.holdings.length} open positions`)}
      ${kpi("Total gain", eurS(T.totalGain), "incl. dividends, net", cls(T.totalGain))}
      ${kpi("XIRR p.a.", pct(T.xirr), `since ${sinceY}`)}
      ${kpi("Dividends", eur(T.dividendsNet), `${countOf("dividend")} payments, net`)}
    </dl>
    ${auditLine()}
  </section>
  ${insightsSection(false)}

  <div class="grid2">
    <section class="sec">
      <div class="sechead"><h2 class="t-title-l">Allocation</h2><span class="sub t-body-m">${P.holdings.length} positions</span></div>
      <div class="stack" role="img" aria-label="Allocation by position">${alloc.map(a => `<i style="width:${(a.v / SECV * 100).toFixed(2)}%;background:${a.color}"></i>`).join("")}</div>
      <div class="list">${alloc.map(a => `<div class="lrow"><span class="lname"><i class="sw" style="background:${a.color}"></i><span class="t-body-l">${esc(a.name)}</span></span>
        <span class="lfig t-body-m"><span class="pc">${nf1.format(a.v / SECV * 100)}${NB}%</span><span class="eu">${eur0(a.v)}</span></span></div>`).join("")}</div>
      ${CASH.length ? `<div class="list">${CASH.map(c => `<div class="lrow"><span class="lname"><i class="sw" style="background:var(--md-sys-color-outline)"></i><span class="t-body-l">Cash · ${esc(c.account)}</span></span>
        <span class="lfig t-body-m"><span class="eu">${c.value < 0 ? eurS(c.value) : eur(c.value)}</span></span></div>`).join("")}</div>
      <p class="muted t-body-s">Cash balances count towards total value, as in Parqet, but not towards gains or the shares above.${CASH.some(c => c.value < 0) ? " A negative balance means deposits to that account aren’t recorded in Parqet." : ""}</p>` : ""}
    </section>
    <section class="sec">
      <div class="sechead"><h2 class="t-title-l">Dividends by year</h2><span class="sub t-body-m nw">net · ${eur(T.dividendsNet)}</span></div>
      ${years.length ? `<div class="ybars" role="img" aria-label="Net dividends per year">${years.map(y => `<div class="ybar">
        <em class="t-label-m">${nf0.format(byYear[y])}</em><i style="height:${Math.max(3, byYear[y] / ymax * 100).toFixed(1)}%"></i><span class="t-label-m">’${y.slice(2)}</span></div>`).join("")}</div>
        <p class="muted t-body-s">€ per year after withholding tax${T.dividendsTax ? ` · <span class="nw">${eur(T.dividendsTax)}</span> withheld in total` : ""}</p>`
        : `<div class="empty">No dividends yet.</div>`}
    </section>
  </div>

  <section class="sec">
    <div class="sechead"><h2 class="t-title-l">Holdings</h2><span class="sub t-body-m">by value</span>
      <a class="link act sl" href="#holdings">All ${ms(ICON.chev)}</a></div>
    <div class="list">${P.holdings.slice(0, 4).map(h => holdingCard(h, true)).join("")}</div>
  </section>

  ${P.closed.length ? `<section class="sec">
    <div class="sechead"><h2 class="t-title-l">Closed positions</h2><span class="sub t-body-m">${P.closed.length} sold · realised <span class="nw">${eurS(realizedClosed).replace(/,\d\d$/, "")}</span></span></div>
    ${divergingRows([...winners, ...losers])}
    <a class="link sl" href="#holdings" data-hf="closed" style="align-self:flex-start">See all ${P.closed.length} ${ms(ICON.chev)}</a>
  </section>` : ""}`;
}

/* ============================== holdings ============================== */
function vHoldings() {
  const closedTotal = P.closed.reduce((s, c) => s + c.realizedNet, 0);
  return `
  <p class="lead-p t-body-l">Every figure is rebuilt from the activity ledger. Open a position to see the lots behind its cost basis.</p>
  <div class="cbg t-label-l" role="group" aria-label="Show">
    <button class="sl" data-hfilter="open" aria-pressed="${S.hfilter === "open"}">${S.hfilter === "open" ? ms("check") : ""}Open · ${P.holdings.length}</button>
    <button class="sl" data-hfilter="closed" aria-pressed="${S.hfilter === "closed"}">${S.hfilter === "closed" ? ms("check") : ""}Closed · ${P.closed.length}</button>
  </div>
  ${S.hfilter === "open"
    ? `<div class="list">${P.holdings.map(h => holdingCard(h)).join("")}</div>`
    : `<section class="sec"><div class="sechead"><h2 class="t-title-l">Realised P/L</h2><span class="sub t-body-m">net of fees & taxes · total <span class="nw">${eurS(closedTotal)}</span></span></div>
        ${P.closed.length ? divergingRows(P.closed) : `<div class="empty">Nothing sold yet.</div>`}</section>`}`;
}

/* ============================== activity ============================== */
function vActivity() {
  const F = { all: () => true, buy: r => r.type === "BUY", sell: r => r.type === "SELL", dividend: r => r.type === "DIVIDEND" };
  const rows = P.ledger.filter(F[S.afilter]);
  const shown = rows.slice(0, S.apage);
  const sum = t => P.ledger.filter(r => r.type === t).reduce((s, r) => s + Math.abs(r.net), 0);
  let html = "", month = "";
  for (const r of shown) {
    const m = r.d.slice(0, 7);
    if (m !== month) {
      if (month) html += `</div></div>`;
      const mt = rows.filter(x => x.d.startsWith(m)).reduce((s, x) => s + x.net, 0);
      html += `<div class="mgroup"><div class="monthhead t-title-s"><span>${fmtMY(r.d)}</span><span>${eurS(mt)}</span></div><div class="list" style="border-top:0">`;
      month = m;
    }
    const t = r.type.toLowerCase();
    const sub = r.type === "DIVIDEND"
      ? `${fmtD(r.d)} · gross <span class="nw">${eur(r.gross)}</span>${r.tax ? ` · tax <span class="nw">${eur(r.tax)}</span>` : ""}`
      : `${fmtD(r.d)} · <span class="nw">${nfq.format(r.shares)} @ ${r.priceCcy && r.priceCcy !== "EUR" ? nf2.format(r.priceNative) + NB + r.priceCcy : eur(r.price)}</span>`;
    const kind = r.type === "BUY" ? "Buy" : r.type === "SELL" ? "Sell" : "Dividend";
    html += `<div class="arow"><span class="aic ${t}" title="${kind}">${ms(ICON[t] || ICON.buy, "md")}</span>
      <span class="abody"><span class="atop"><span class="an">${esc(r.name)}${r.preSplit ? `<span class="split" title="Recorded before a ${r.preSplit}:1 split">pre-split</span>` : ""}${r.source ? `<span class="split src">${esc(r.source)}</span>` : MULTI && r.account ? `<span class="split src">${esc(r.account)}</span>` : ""}</span><span class="aa ${r.net > 0 ? "pos" : ""}">${eurS(r.net)}</span></span>
      <span class="asub t-body-s">${kind} · ${sub}${r.fee ? ` · fee <span class="nw">${eur(r.fee)}</span>` : ""}</span></span></div>`;
  }
  if (month) html += `</div></div>`;
  return `
  <p class="lead-p t-body-l">${P.ledger.length} activities in the ledger, newest first.</p>
  <section class="sec"><dl class="sumlist t-body-m">
    ${stat("Bought", `${eur0(sum("BUY"))}<small>${countOf("buy")} buys</small>`)}
    ${stat("Sold", `${eur0(sum("SELL"))}<small>${countOf("sell")} sells</small>`)}
    ${stat("Dividends", `${eur0(sum("DIVIDEND"))}<small>${countOf("dividend")} payments</small>`)}
  </dl></section>
  <div class="chips t-label-l" role="group" aria-label="Filter activities">
    ${[["all", "All", P.ledger.length], ["buy", "Buys", countOf("buy")], ["sell", "Sells", countOf("sell")], ["dividend", "Dividends", countOf("dividend")]]
      .map(([k, l, n]) => `<button class="fchip sl" data-afilter="${k}" aria-pressed="${S.afilter === k}">${S.afilter === k ? ms("check") : ""}${l}<span class="ct">${n}</span></button>`).join("")}
  </div>
  <section class="ledger" style="margin-top:-24px">${html || `<div class="empty">No activities.</div>`}</section>
  ${rows.length > shown.length ? `<button class="btn outlined block sl" data-more="1">Show ${Math.min(60, rows.length - shown.length)} more · ${rows.length - shown.length} left</button>` : ""}`;
}
</script>
<script>
"use strict";
/* ============================== import ============================== */
/* Real file import: files are read on this device, text is extracted with pdf.js,
   broker parsers in importers/*.js turn it into transactions, and nothing reaches
   the ledger until the review is confirmed. Every confirmed batch can be undone. */
const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const SUPPORTED = [
  ["flatex.at", "Buy and sell statements (PDF)", true],
  ["flatex.at", "Transaction export (CSV)", false],
  ["DADAT", "Umsatzliste (XLSX)", false],
];
S.batches = [];
const parsers = () => Object.values(window.Importers || {});

let pdfjsLoading = null;
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
}
function loadPdfJs() {
  if (window.pdfjsLib && window.pdfjsWorker) return Promise.resolve(window.pdfjsLib);
  // The worker code runs on the main thread (no Worker, no blob: URL), which works under
  // file:// and strict CSPs alike. Broker statements are 1–3 pages, so this is instant.
  return pdfjsLoading ||= loadScript(PDFJS_BASE + "pdf.min.js")
    .then(() => loadScript(PDFJS_BASE + "pdf.worker.min.js"))
    .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js"; return window.pdfjsLib; })
    .catch(() => { pdfjsLoading = null; throw new Error("Couldn't load the PDF reader. Check your connection and try again."); });
}
async function pdfPages(buf) {
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false, disableFontFace: true }).promise;
  const pages = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const tc = await (await doc.getPage(n)).getTextContent();
    pages.push(tc.items.filter(i => "str" in i).map(i => ({ str: i.str, x: i.transform[4], y: i.transform[5] })));
  }
  doc.destroy();
  return pages;
}
async function fileHash(buf) {
  try {
    const d = await crypto.subtle.digest("SHA-256", buf);
    return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch {                                   // no SubtleCrypto (non-secure context): FNV-1a + length
    let h = 0x811c9dc5; const u = new Uint8Array(buf);
    for (const x of u) { h ^= x; h = Math.imul(h, 0x01000193) >>> 0; }
    return "fnv-" + h.toString(16) + "-" + u.length;
  }
}
// Long broker file names (date_type_account_number.pdf) wrap at their separators, not mid-letter.
const fileLabel = n => esc(n).replace(/([_\-.])/g, "$1<wbr>");
const knownName = isin => [...P.holdings, ...P.closed].find(h => h.isin === isin)?.name;

async function handleFiles(list) {
  const files = [...list];
  if (!files.length) return;
  S.imp = { step: "review", filter: "all", files: files.map(f => ({ name: f.name, status: "reading" })), rows: [] };
  render();
  document.getElementById("fileImport")?.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  for (let i = 0; i < files.length; i++) {
    const f = files[i], st = S.imp.files[i];
    try {
      const buf = await f.arrayBuffer();
      st.hash = await fileHash(buf.slice(0));
      const prior = S.batches.find(x => x.files.some(y => y.hash === st.hash));
      if (prior) { st.status = "skip"; st.message = `You imported this exact file ${fmtTime(prior.at)}.`; continue; }
      if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf") {
        st.status = "skip";
        st.message = /\.(csv|xlsx?)$/i.test(f.name) ? "CSV and XLSX exports aren't supported yet. Use the PDF statements for now." : "Not a supported file type.";
        continue;
      }
      st.status = "parsing"; render();
      const pages = await pdfPages(buf);
      const [best] = parsers().map(x => [x, x.detect(pages)]).sort((m, n) => n[1] - m[1]);
      if (!best || best[1] < 0.5) { st.status = "skip"; st.message = "Not recognised as a supported broker statement."; continue; }
      const res = best[0].parse(pages);
      st.parser = best[0].label; st.docType = res.docType;
      if (!res.transactions.length) { st.status = "skip"; st.message = res.issues[0]?.message || "No transactions found."; continue; }
      st.status = "ok"; st.count = res.transactions.length;
      for (const t of res.transactions) S.imp.rows.push({ ...t, id: `${st.hash.slice(0, 12)}-${S.imp.rows.length}`, display: knownName(t.isin) || t.name, fileHash: st.hash });
    } catch (err) {
      st.status = "error"; st.message = err?.message || String(err);
    } finally {
      classify(); if (S.imp?.step === "review") render();
    }
  }
}

/* Decide each row's status. Never guesses: anything uncertain needs an explicit choice. */
function classify() {
  const rows = S.imp.rows;
  const same = (a, b) => a.isin === b.isin && a.type === b.type && Math.abs((a.shares || 0) - (b.shares || 0)) < 1e-6;
  rows.forEach((r, idx) => {
    r.why = ""; r.fix = null;
    const errors = r.issues.filter(x => x.level === "error");
    if (errors.length) { r.st = "attn"; r.why = "Couldn't read this statement reliably: " + errors.map(x => x.message).join(" "); r.on = false; return; }
    if (P.ledger.some(l => (r.txNo && l.txNo === r.txNo) || (l.source === r.source && l.d === r.date && same(l, r) && Math.abs(l.net - r.net) < 0.01))) {
      r.st = "dup"; r.why = "Already in your ledger."; r.on = false; return;
    }
    if (rows.slice(0, idx).some(o => o.txNo && o.txNo === r.txNo)) { r.st = "dup"; r.why = "Same trade as a row above."; r.on = false; return; }
    const near = P.ledger.find(l => !l.source && same(l, r) && Math.abs(Date.parse(l.d) - Date.parse(r.date)) <= 3 * 864e5);
    if (near && !r.ack) { r.st = "dup"; r.fix = "ack"; r.why = `Looks like the ${fmtD(near.d)} trade synced from Parqet.`; r.on = false; return; }
    if (r.type === "SELL" && !r.ack) {
      const inLedger = P.ledger.filter(l => l.account === r.account && l.isin === r.isin)
        .reduce((n, l) => n + (l.type === "BUY" ? l.shares : l.type === "SELL" ? -l.shares : 0), 0);
      const inReview = rows.filter(o => o !== r && o.type === "BUY" && o.isin === r.isin && o.date <= r.date && o.st === "new").reduce((n, o) => n + o.shares, 0);
      if (inLedger + inReview + 1e-6 < r.shares) {
        r.st = "attn"; r.fix = "ack"; r.on = false;
        r.why = `No earlier purchase of ${r.display} on flatex.at. Add the buy statement too, or this sale shows as a short position.`;
        return;
      }
    }
    for (const w of r.issues.filter(x => x.level === "warning")) r.why += (r.why ? " " : "") + w.message;
    r.st = "new"; if (r.on === undefined || r.on === false && !r.userOff) r.on = true;
  });
}
const icount = rows => ({ all: rows.length, new: rows.filter(r => r.st === "new").length, dup: rows.filter(r => r.st === "dup").length,
  attn: rows.filter(r => r.st === "attn").length, on: rows.filter(r => r.on && r.st === "new").length });

function commitImport() {
  const sel = S.imp.rows.filter(r => r.on && r.st === "new");
  const id = "batch-" + Date.now();
  P.ledger.push(...sel.map(r => ({
    d: r.date, type: r.type, name: r.display, isin: r.isin, shares: r.shares,
    price: r.gross / r.shares, priceNative: r.price, priceCcy: r.priceCcy, fx: r.fx,
    gross: r.gross, fee: r.fee, tax: r.tax, net: r.net, realized: r.realized,
    source: r.source, account: r.account, txNo: r.txNo, batch: id,
  })));
  P.ledger.sort((m, n) => n.d.localeCompare(m.d));
  const files = S.imp.files.filter(f => f.status === "ok" && sel.some(r => r.fileHash === f.hash)).map(f => ({ name: f.name, hash: f.hash }));
  S.batches.unshift({ id, at: new Date().toISOString(), files, count: sel.length, source: sel[0]?.source || "file" });
  S.imp = { step: "done", batch: id, count: sel.length };
}
function undoBatch(id) {
  const b = S.batches.find(x => x.id === id); if (!b) return;
  P.ledger = P.ledger.filter(l => l.batch !== id);
  S.batches = S.batches.filter(x => x.id !== id);
  if (S.imp?.batch === id) S.imp = null;
  toast(`Import undone: ${b.count} transaction${b.count === 1 ? "" : "s"} removed in one step.`);
}

function reviewRow(r) {
  const kind = r.type === "BUY" ? "Buy" : "Sell";
  const px = r.priceCcy === "EUR" ? eur(r.price) : `${nf2.format(r.price)}${NB}${r.priceCcy}`;
  const canTick = r.st === "new";
  return `<div class="rcard" data-st="${r.st}">
    <input type="checkbox" class="cbx" id="irow-${r.id}" data-irow="${r.id}" ${r.on && canTick ? "checked" : ""} ${canTick ? "" : "disabled"} aria-label="Include ${esc(r.display)} ${kind.toLowerCase()} on ${fmtD(r.date)}">
    <span class="t"><span class="rtop"><b>${esc(r.display)}</b><span class="a t-body-m ${r.net > 0 ? "pos" : ""}">${eurS(r.net)}</span></span>
      <span class="t-body-s">${kind} · <span class="nw">${fmtD(r.date)}${r.time ? ", " + r.time : ""}</span>${r.venue ? ` · ${esc(r.venue)}` : ""}</span>
      <span class="t-body-s"><span class="mono nw">${r.isin}</span> · <span class="nw">${nfq.format(r.shares)} @ ${px}</span>${r.priceCcy !== "EUR" ? ` · <span class="nw">FX ${nfq.format(r.fx)}</span>` : ""}</span>
      <span class="t-body-s">Value <span class="nw">${eur(r.gross)}</span> · fees <span class="nw">${eur(r.fee)}</span> · KESt <span class="nw">${eur(r.tax)}</span>${r.type === "SELL" && r.realized != null ? ` · gain <span class="nw">${eurS(r.realized)}</span>` : ""}</span>
      ${r.why ? `<span class="t-body-s issue">${r.st !== "new" ? ms("warning") : ms(ICON.info)}<span>${esc(r.why)}</span></span>` : ""}</span>
    ${r.fix === "ack" ? `<div class="fix"><button class="cand sl" data-ack="${r.id}"><b>Import anyway</b><span class="m t-label-l">I've checked it</span></button></div>` : ""}
  </div>`;
}

function vImport() {
  const sync = P.sync, bad = (sync.reconcile || []).filter(c => !c.ok);
  const method = P.totals.costBasisMethod || "FIFO";
  const splits = P.holdings.flatMap(h => (h.splits || []).map(s => `${h.name} ${s.ratio}:1 (${s.exDate.slice(0, 4)})`));
  const sourceSec = IS_DEMO
    ? `<section class="sec"><div class="srchead"><span class="srcav">${ms("science")}</span>
        <div><h2 class="t-title-l">Demo data</h2><p class="t-body-m">No portfolio snapshot found. Run <span class="mono nw">tools/parqet-import</span> to load yours. It stays on your machine.</p></div></div></section>`
    : `<section class="sec">
      <div class="srchead"><span class="srcav" aria-hidden="true">P</span>
        <div><h2 class="t-title-l">Parqet <span class="status ${bad.length ? "neg" : "pos"}">${ms(bad.length ? "priority_high" : "check")}${bad.length ? bad.length + " to fix" : "In sync"}</span></h2>
          <p class="t-body-m">${esc(P.meta.portfolio.name)} · last sync <span class="nw">${fmtTime(P.meta.convertedAt || P.meta.asOf)}</span></p></div></div>
      <div class="inline-facts t-body-m"><span><b>${sync.activities}</b> activities</span><span><b>${sync.holdingsOpen}</b> open positions</span><span><b>${sync.holdingsClosed}</b> closed</span></div>
      <div class="sechead" style="margin-top:8px"><h3 class="t-title-m">Reconciliation</h3><span class="sub t-body-s">lots rebuilt from the ledger vs. Parqet</span></div>
      <div class="list">${sync.reconcile.map(c => `<div class="recon-row">
          <span class="ms ${c.ok ? "pos" : "neg"}" aria-hidden="true">${c.ok ? "check" : "priority_high"}</span>
          <span><span class="rtop"><b>${esc(c.name)}</b>${c.splits?.length ? `<span class="tag warn">${c.splits.map(s => s.ratio + ":1").join(" ")} split</span>` : ""}</span>
          <span class="d t-body-s">${c.ok ? `${c.shares ? `<span class="nw">${nfq.format(c.shares.ours)} shares</span> · ` : ""}matches ${esc((c.matches || [method])[0])}` : esc(c.issue || "does not reconcile")}</span></span>
        </div>`).join("")}</div>
      ${splits.length ? `<div class="note t-body-m">${ms(ICON.info)}<span>Parqet's activity feed isn't split-adjusted. Applied on ex-date: <b>${splits.join(", ")}</b>.</span></div>` : ""}
      ${auditLine()}
      <div class="btnrow"><button class="btn filled sl" data-sync="1">${ms("sync")}Sync now</button><button class="btn outlined sl" data-howsync="1">${ms("help")}How sync works</button></div>
    </section>`;

  const I = S.imp;
  let flow;
  if (!I) {
    flow = `<div class="drop" data-drop>
        <span class="ms" aria-hidden="true">upload_file</span>
        <b class="t-title-m">Add broker statements</b>
        <span class="t-body-m muted">Drop PDFs here, or pick them from your phone.</span>
        <button class="btn filled sl" data-pick="1">${ms("add")}Choose files</button>
        <input type="file" id="filePick" class="vh" accept=".pdf,application/pdf,.csv,text/csv,.xlsx" multiple tabindex="-1" aria-hidden="true">
        <span class="t-body-s muted">${ms("lock")}Read on this device. Nothing is uploaded.</span>
      </div>
      <div class="list">${SUPPORTED.map(([b, what, ok]) => `<div class="recon-row">
          <span class="ms ${ok ? "pos" : ""}" aria-hidden="true">${ok ? "check" : "remove"}</span>
          <span><b>${b}</b><span class="d t-body-s">${what}${ok ? "" : " · not yet, send a sample file"}</span></span></div>`).join("")}</div>`;
  } else if (I.step === "review") {
    const c = icount(I.rows), busy = I.files.some(f => f.status === "reading" || f.status === "parsing");
    const shown = I.rows.filter(r => I.filter === "all" || r.st === I.filter);
    flow = `<div class="list">${I.files.map(f => `<div class="filerow">
          <span class="ms ${f.status === "ok" ? "pos" : f.status === "error" ? "neg" : ""}" aria-hidden="true">${f.status === "ok" ? "picture_as_pdf" : f.status === "error" ? "error" : f.status === "skip" ? "remove" : "sync"}</span>
          <span><span class="fn" data-wrap-ok>${fileLabel(f.name)}</span>
          <span class="d t-body-s muted" style="display:block">${
            f.status === "reading" ? "Reading…" : f.status === "parsing" ? "Extracting text…"
            : f.status === "ok" ? `${esc(f.parser)} · ${esc(f.docType || "")} · ${f.count} transaction${f.count === 1 ? "" : "s"}`
            : esc(f.message || "")}</span></span></div>`).join("")}</div>
      ${I.rows.length ? `<div class="chips wrap t-label-l">${[["all", "All"], ["new", "New"], ["dup", "Duplicates"], ["attn", "Needs attention"]]
          .map(([k, l]) => `<button class="fchip sl" data-ifilter="${k}" aria-pressed="${I.filter === k}">${I.filter === k ? ms("check") : ""}${l}<span class="ct">${c[k]}</span></button>`).join("")}</div>
        <div class="list">${shown.map(reviewRow).join("") || `<div class="empty">Nothing in this filter.</div>`}</div>` : ""}
      <div class="btnrow"><button class="btn outlined sl" data-imp="cancel">Cancel</button>
        <button class="btn filled sl" data-imp="commit" ${c.on && !busy ? "" : "disabled"}>${busy ? "Reading…" : `Import ${c.on}`}</button></div>`;
  } else {
    flow = `<div class="donebox"><span class="ms fill" aria-hidden="true">check_circle</span>
        <b class="t-title-l">${I.count} transaction${I.count === 1 ? "" : "s"} imported</b>
        <p class="t-body-m">Added to Activity as one batch. Undo removes the whole batch at once. In this prototype imports live until you reload the page.</p></div>
      <div class="btnrow"><button class="btn outlined sl" data-undo="${I.batch}">${ms("undo")}Undo import</button><a class="btn tonal sl" href="#activity" data-goact="1">View in Activity</a>
        <button class="btn filled sl" data-imp="cancel">Import more</button></div>`;
  }
  const history = S.batches.length ? `<section class="sec"><div class="sechead"><h2 class="t-title-l">Import history</h2><span class="sub t-body-m">each batch can be undone</span></div>
      <div class="list">${S.batches.map(x => `<div class="recon-row"><span class="ms" aria-hidden="true">picture_as_pdf</span>
        <span><b>${x.count} from ${esc(x.source)}</b><span class="d t-body-s" data-wrap-ok>${x.files.map(f => fileLabel(f.name)).join(", ")} · ${fmtTime(x.at)}</span></span>
        <button class="btn text sl" data-undo="${x.id}">Undo</button></div>`).join("")}</div></section>` : "";
  return `
  <p class="lead-p t-body-l">Connected sources sync automatically. Broker files go through review first, so nothing reaches the ledger unseen.</p>
  <section class="sec" id="fileImport"><div class="sechead"><h2 class="t-title-l">Import a file</h2><span class="sub t-body-m">PDF statements</span></div>${flow}</section>
  ${history}
  ${sourceSec}`;
}

/* ============================== more ============================== */
function vMore() {
  const theme = currentThemeSetting();
  const diff = austriaBasis - T.invested;
  return `
  <section class="sec">
    <div class="srchead"><span class="srcav" aria-hidden="true">${esc(P.meta.portfolio.name.slice(0, 1))}</span>
      <div><h2 class="t-title-l">${esc(P.meta.portfolio.name)}</h2><p class="t-body-m">${IS_DEMO ? "Demo depot" : "Synced from Parqet"} · ${P.meta.currency} · since ${fmtD(P.meta.since || SERIES[0].d)}</p></div></div>
    <div class="inline-facts t-body-m"><span><b>${eur0(T.value)}</b> value</span><span><b>${P.holdings.length}</b> open</span><span><b>${P.ledger.length}</b> activities</span></div>
    ${MULTI ? `<div class="list">${ACCOUNTS.map(a => `<div class="srow">${ms("payments")}<div><b>${esc(a.name)}</b><p class="t-body-m">${a.activities} activities</p></div></div>`).join("")}</div>` : ""}
  </section>
  ${DB.ready ? `<section class="sec"><h2 class="t-title-l">Calculation checks</h2>${auditLine() || `<p class="muted t-body-m">No check has run yet. The daily sync verifies every figure against the raw trades and Parqet.</p>`}</section>` : ""}
  ${insightsSection(true)}
  <section class="sec">
    <h2 class="t-title-l">Cost basis</h2>
    <div class="list">
      <div class="srow">${ms("calculate")}<div><b>${esc(T.costBasisMethod || "FIFO")}</b><p class="t-body-m">Matches Parqet, so gains agree with what you see there.</p>
        <select id="costMethod" aria-label="Cost basis method"><option>FIFO, fees excluded</option><option>Moving average, fees excluded (AT KESt)</option></select></div></div>
    </div>
    ${Math.abs(diff) >= 0.01 ? `<div class="note t-body-m">${ms(ICON.info)}<span>For Austrian KESt, privately held securities use <b>moving average, fees excluded</b>. Your basis would be <b class="nw">${eur(austriaBasis)}</b>, <span class="nw">${eurS(diff)}</span> against FIFO.</span></div>` : ""}
  </section>
  <section class="sec">
    <h2 class="t-title-l">Appearance</h2>
    <div class="cbg t-label-l" role="group" aria-label="Theme">
      ${[["system", "System"], ["light", "Light"], ["dark", "Dark"]].map(([k, l]) => `<button class="sl" data-theme-set="${k}" aria-pressed="${theme === k}">${theme === k ? ms("check") : ""}${l}</button>`).join("")}</div>
  </section>
  <section class="sec">
    <h2 class="t-title-l">Data & privacy</h2>
    <div class="list">
      <div class="srow">${ms("lock")}<div><span class="rtop"><b>${IS_DEMO ? "Demo snapshot" : "Local snapshot"}</b><span class="tag ${IS_DEMO ? "warn" : ""}">${IS_DEMO ? "Demo" : "Private"}</span></span><p class="t-body-m">${IS_DEMO
        ? "Fictional data shipped with the repository."
        : "Lives in <span class='mono nw'>portfolio.local.js</span>, which is gitignored. The repository is public, so personal data never goes into it."}</p></div></div>
      <div class="srow">${ms("monitoring")}<div><b>Prices</b><p class="t-body-m">Last quotes from ${exchangeName(P.holdings[0]?.quote?.exchange || "—")} · <span class="nw">${fmtTime(P.meta.asOf)}</span></p></div></div>
    </div>
  </section>`;
}

/* ============================== theme ============================== */
const root = document.documentElement;
const sysDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
function currentThemeSetting() { try { return localStorage.getItem("dl-theme") || "system"; } catch { return "system"; } }
function applyTheme(mode) {
  if (mode === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", mode);
  try { localStorage.setItem("dl-theme", mode); } catch {}
  const dark = mode === "dark" || (mode === "system" && sysDark());
  const btn = document.getElementById("themeBtn");
  btn.innerHTML = ms(dark ? ICON.sun : ICON.moon);
  btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}

/* ============================== router ============================== */
const VIEWS = { overview: vOverview, holdings: vHoldings, activity: vActivity, import: vImport, more: vMore };
const NAV = [["overview", "Overview"], ["holdings", "Holdings"], ["activity", "Activity"], ["import", "Import"], ["more", "More"]];
const view = document.getElementById("view");
let ro = null, lastW = 0;

function renderNav() {
  const bad = (P.sync?.reconcile || []).filter(c => !c.ok).length;
  document.getElementById("bottomNav").innerHTML = NAV.map(([k, l]) => `<a class="tab" href="#${k}" aria-label="${l}" ${S.view === k ? 'aria-current="page"' : ""}>
    <span class="ic">${ms(ICON[k])}${k === "import" && bad ? `<span class="badge">${bad}</span>` : ""}</span><span class="lbl">${l}</span></a>`).join("");
  document.getElementById("railNav").innerHTML = NAV.map(([k, l]) => `<a class="navitem sl" href="#${k}" ${S.view === k ? 'aria-current="page"' : ""}>
    ${ms(ICON[k])}${l}${k === "import" && bad ? `<span class="cnt">${bad}</span>` : ""}</a>`).join("");
  document.getElementById("screenTitle").textContent = NAV.find(n => n[0] === S.view)[1];
}
function render() {
  renderNav();
  view.innerHTML = VIEWS[S.view]();
  if (ro) { ro.disconnect(); ro = null; }
  if (S.view === "overview") mountHero();
}
function mountHero() {
  const host = document.getElementById("chart"), readout = document.getElementById("readout");
  const idle = readout.innerHTML;
  const paint = () => wireScrub(host, drawChart(host, seriesFor(S.range)), readout, idle);
  paint(); lastW = host.clientWidth;
  ro = new ResizeObserver(() => { const w = host.clientWidth; if (Math.abs(w - lastW) >= 2) { lastW = w; paint(); } });
  ro.observe(host);
}
function route() {
  const k = (location.hash || "#overview").slice(1);
  S.view = VIEWS[k] ? k : "overview";
  render(); window.scrollTo({ top: 0 });
  view.classList.remove("enter"); void view.offsetWidth; view.classList.add("enter");
}

/* ============================== events ============================== */
view.addEventListener("click", e => {
  const q = sel => e.target.closest(sel);
  let el;
  if ((el = q("[data-range]"))) { S.range = el.dataset.range; return render(); }
  if ((el = q("[data-hold]"))) { const id = el.dataset.hold; if (S.view !== "holdings") { S.open.add(id); S.hfilter = "open"; location.hash = "#holdings"; return; } S.open.has(id) ? S.open.delete(id) : S.open.add(id); return render(); }
  if ((el = q("[data-hf]"))) { S.hfilter = el.dataset.hf; return; }
  if ((el = q("[data-hfilter]"))) { S.hfilter = el.dataset.hfilter; return render(); }
  if ((el = q("[data-afilter]"))) { S.afilter = el.dataset.afilter; S.apage = 60; return render(); }
  if ((el = q("[data-more]"))) { S.apage += 60; return render(); }
  if ((el = q("[data-theme-set]"))) { applyTheme(el.dataset.themeSet); return render(); }
  if ((el = q("[data-sync]"))) return toast("Ask Claude to “sync Parqet”. It captures fresh payloads and runs tools/parqet-import, then this page shows the new snapshot.");
  if ((el = q("[data-howsync]"))) return toast("Parqet → raw payloads (gitignored) → convert.mjs rebuilds lots, applies splits, reconciles → portfolio.local.js.");
  if ((el = q("[data-pick]"))) { document.getElementById("filePick")?.click(); return; }
  if ((el = q("[data-ifilter]"))) { S.imp.filter = el.dataset.ifilter; return render(); }
  if ((el = q("[data-ack]"))) { const r = S.imp.rows.find(x => x.id === el.dataset.ack); r.ack = true; r.on = true; classify(); return render(); }
  if ((el = q("[data-undo]"))) { undoBatch(el.dataset.undo); return render(); }
  if ((el = q("[data-goact]"))) { S.afilter = "all"; S.apage = 60; S.imp = null; return; }
  if ((el = q("[data-imp]"))) {
    const a = el.dataset.imp;
    if (a === "cancel") S.imp = null;
    else if (a === "commit") commitImport();
    return render();
  }
});
view.addEventListener("change", e => {
  if (e.target.id === "filePick") { handleFiles(e.target.files); return; }
  const r = e.target.closest("[data-irow]");
  if (r) { const row = S.imp.rows.find(x => x.id === r.dataset.irow); row.on = r.checked; row.userOff = !r.checked; render(); }
});
view.addEventListener("dragover", e => { const d = e.target.closest("[data-drop]"); if (d) { e.preventDefault(); d.classList.add("over"); } });
view.addEventListener("dragleave", e => { const d = e.target.closest("[data-drop]"); if (d && !d.contains(e.relatedTarget)) d.classList.remove("over"); });
view.addEventListener("drop", e => { const d = e.target.closest("[data-drop]"); if (d) { e.preventDefault(); handleFiles(e.dataTransfer.files); } });
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.getAttribute("data-theme") === "dark" || (!root.hasAttribute("data-theme") && sysDark());
  applyTheme(dark ? "light" : "dark"); if (S.view === "more") render();
});
window.addEventListener("hashchange", route);
window.addEventListener("scroll", () => document.getElementById("topbar").classList.toggle("scrolled", window.scrollY > 4), { passive: true });

/* ============================== boot ============================== */
document.getElementById("railSub").textContent = `${P.meta.portfolio.name} · ${eur0(T.value)}`;
document.getElementById("srcLabel").textContent = IS_DEMO ? "Demo data" : "Parqet";
document.getElementById("srcIcon").textContent = IS_DEMO ? "science" : "cloud_done";
document.getElementById("srcPill").classList.toggle("demo", IS_DEMO);
document.getElementById("srcPill").title = IS_DEMO ? "Demo data" : "Synced from Parqet";
document.getElementById("railFoot").innerHTML = IS_DEMO ? "Demo data, fictional." : `Synced from Parqet<br>${fmtTime(P.meta.convertedAt || P.meta.asOf)}`;
applyTheme(currentThemeSetting());
route();
// Light up insights and check results when this page runs inside its artifact; absent elsewhere.
(async () => {
  const db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) return;
  DB.ready = true;
  const rerender = () => { if (S.view !== "activity" && !S.imp) render(); };
  db.collection("insights").orderBy("createdAt", "desc").limit(50)
    .onSnapshot(snap => { DB.insights = snap.docs.map(d => ({ id: d.id, ...d.data() })); rerender(); }, () => {});
  db.doc("audits/latest").onSnapshot(snap => { DB.audit = snap.exists ? snap.data() : null; rerender(); }, () => {});
  rerender();
})();
</script>
