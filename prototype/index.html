<title>Depot Ledger</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2f2a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* =====================================================================
   Tokens — "Secession gold on emerald ink": banknote-guilloché hero,
   jewel-tone holdings. Light palette on :root, dark redefined twice.
   ===================================================================== */
:root{
  --plane:#edf3f0; --surface:#ffffff; --surface-2:#f5f9f7; --surface-3:#e4ece8;
  --ink:#0d1f1b; --ink-2:#3f5650; --muted:#6c8079;
  --line:#d7e3de; --line-2:#bccdc6;
  --jade:#0f7f6b; --jade-ink:#0a5e4f; --jade-wash:rgba(15,127,107,.10);
  --gold:#b98222; --gold-wash:rgba(201,149,46,.14);
  --pos:#006300; --neg:#c0322f; --pos-wash:rgba(12,163,12,.11); --neg-wash:rgba(208,59,59,.11);
  --warn:#8a5d00; --warn-wash:rgba(250,178,25,.18);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4;
  --hero-a:#0b2c27; --hero-b:#10443b; --hero-ink:#f3f7f2; --hero-ink-2:rgba(243,247,242,.72);
  --hero-gold:#e6b85a; --hero-band:rgba(170,226,208,.20); --hero-band-line:rgba(170,226,208,.75);
  --hero-pos:#8ef0a8; --hero-neg:#ffaba1; --hero-chip:rgba(255,255,255,.11);
  --shadow:0 1px 2px rgba(13,31,27,.05),0 8px 24px -12px rgba(13,31,27,.18);
  --r:16px; --r-sm:10px;
  --f-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --plane:#070f0d; --surface:#0f1b18; --surface-2:#13221e; --surface-3:#1a2c27;
  --ink:#e8f1ed; --ink-2:#a9bdb6; --muted:#7f948d;
  --line:#1d2f2a; --line-2:#2b423b;
  --jade:#35c2a4; --jade-ink:#7fe0c8; --jade-wash:rgba(53,194,164,.14);
  --gold:#e6b85a; --gold-wash:rgba(230,184,90,.14);
  --pos:#2fb84a; --neg:#ef7070; --pos-wash:rgba(47,184,74,.15); --neg-wash:rgba(239,112,112,.15);
  --warn:#e8b04a; --warn-wash:rgba(250,178,25,.13);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
  --hero-a:#081f1c; --hero-b:#0d3730;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --plane:#070f0d; --surface:#0f1b18; --surface-2:#13221e; --surface-3:#1a2c27;
  --ink:#e8f1ed; --ink-2:#a9bdb6; --muted:#7f948d;
  --line:#1d2f2a; --line-2:#2b423b;
  --jade:#35c2a4; --jade-ink:#7fe0c8; --jade-wash:rgba(53,194,164,.14);
  --gold:#e6b85a; --gold-wash:rgba(230,184,90,.14);
  --pos:#2fb84a; --neg:#ef7070; --pos-wash:rgba(47,184,74,.15); --neg-wash:rgba(239,112,112,.15);
  --warn:#e8b04a; --warn-wash:rgba(250,178,25,.13);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
  --hero-a:#081f1c; --hero-b:#0d3730;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* ============================ base ============================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:var(--f-ui); font-size:15px; line-height:1.5; font-weight:500;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
select,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--jade);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-weight:400 !important;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--f-display);font-weight:400}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============================ shell ============================ */
.app{min-height:100%}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  display:flex; align-items:center; gap:10px; min-height:56px;
  padding:8px 16px; background:color-mix(in srgb,var(--plane) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid transparent; transition:border-color .2s;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.mark{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--hero-b),var(--hero-a));box-shadow:inset 0 0 0 1px rgba(230,184,90,.45)}
.mark span{font-family:var(--f-display);color:var(--hero-gold);font-size:19px;line-height:1;transform:translateY(1px)}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand small{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.brandwrap{display:flex;align-items:center;gap:10px;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-3)}
.srcpill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:30px;font-size:12px;font-weight:700;
  background:var(--jade-wash);color:var(--jade-ink);white-space:nowrap}
.srcpill i{width:7px;height:7px;border-radius:50%;background:var(--jade)}
.srcpill.demo{background:var(--warn-wash);color:var(--warn)} .srcpill.demo i{background:var(--warn)}

.rail{display:none}
main.content{
  width:100%; max-width:1180px; margin-inline:auto;
  padding:4px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:16px;
}
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:grid; grid-template-columns:repeat(5,1fr);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(16px); -webkit-backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--line);
}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;
  font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tab .ic{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s,color .2s}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{background:var(--jade-wash);color:var(--jade-ink)}
.tab .dotbadge{position:absolute;top:5px;left:calc(50% + 11px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--c2);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:236px 1fr}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;padding:20px 14px;
    border-right:1px solid var(--line);background:var(--surface)}
  .rail .brandrow{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
  .rail .navitem{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:var(--ink-2);font-weight:700;font-size:14px}
  .rail .navitem:hover{background:var(--surface-3);color:var(--ink)}
  .rail .navitem[aria-current="page"]{background:var(--jade-wash);color:var(--jade-ink)}
  .rail .navitem .cnt{margin-left:auto;background:var(--c2);color:#fff;font-size:10.5px;font-weight:800;border-radius:9px;padding:1px 7px}
  .rail .foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:0 8px;line-height:1.45}
  .bottomnav{display:none}
  .topbar .brandwrap{display:none}
  .topbar{padding:12px 28px}
  main.content{padding:8px 28px 48px;gap:20px}
  body{font-size:14.5px}
}

/* ============================ primitives ============================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cardhead{display:flex;align-items:baseline;gap:10px;padding:16px 16px 0;flex-wrap:wrap}
.cardhead h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.cardhead .sub{font-size:12.5px;color:var(--muted);font-weight:600}
.cardhead .act{margin-left:auto}
.cardbody{padding:14px 16px 16px}
.pagehead{display:flex;flex-direction:column;gap:4px;padding-top:6px}
.pagehead h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(32px,8.5vw,44px);line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
.pagehead p{margin:0;color:var(--ink-2);font-size:14px;max-width:60ch}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:24px;font-size:12px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.pos{background:var(--pos-wash);color:var(--pos)} .chip.neg{background:var(--neg-wash);color:var(--neg)}
.chip.warn{background:var(--warn-wash);color:var(--warn)} .chip.jade{background:var(--jade-wash);color:var(--jade-ink)}
.chip.neutral{background:var(--surface-3);color:var(--ink-2)} .chip.gold{background:var(--gold-wash);color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;
  font-weight:800;font-size:14px;border:1.5px solid var(--line-2);background:var(--surface)}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#04221c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#04221c}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;color:var(--jade-ink);background:transparent}
.btn.ghost:hover{background:var(--jade-wash)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.link{color:var(--jade-ink);font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;min-height:44px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-3)}
.seg button{min-height:38px;border-radius:10px;font-size:13px;font-weight:800;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  z-index:60;max-width:min(92vw,460px);background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:14px;
  font-size:13.5px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.3);animation:toastin .25s ease-out}
@media (min-width:900px){.toast{bottom:28px}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
<style>
/* ============================ hero ============================ */
.hero{
  position:relative; overflow:hidden; isolation:isolate;
  border-radius:22px; color:var(--hero-ink);
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(230,184,90,.20), transparent 55%),
    radial-gradient(90% 70% at 0% 100%, rgba(53,194,164,.18), transparent 60%),
    linear-gradient(160deg,var(--hero-b),var(--hero-a) 70%);
  box-shadow:0 18px 40px -18px rgba(8,40,34,.65), inset 0 0 0 1px rgba(230,184,90,.22);
}
.guilloche{position:absolute;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
.hero-top{padding:18px 18px 4px;display:flex;flex-direction:column;gap:6px}
.hero .eyebrow{color:var(--hero-ink-2)}
.hero .eyebrow b{color:var(--hero-gold);font-weight:800}
.total{font-family:var(--f-display);font-size:clamp(44px,13.5vw,68px);line-height:.98;letter-spacing:-.015em;
  font-variant-numeric:lining-nums;white-space:nowrap}
.total .cur{color:var(--hero-gold);font-size:.62em;vertical-align:.32em;margin-right:.08em}
.total .cents{font-size:.56em;color:var(--hero-ink-2);vertical-align:.38em;margin-left:.02em}
.herochips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.hchip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:28px;background:var(--hero-chip);
  font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.hchip.pos{color:var(--hero-pos)} .hchip.neg{color:var(--hero-neg)} .hchip.dim{color:var(--hero-ink-2);font-weight:700}
.readout{min-height:20px;font-size:12.5px;color:var(--hero-ink-2);font-weight:600;font-variant-numeric:tabular-nums;
  display:flex;gap:10px;flex-wrap:wrap}
.readout b{color:var(--hero-ink);font-weight:800}
.readout .g{color:var(--hero-gold)}
.chartbox{position:relative;padding:4px 6px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.hero-foot{padding:10px 14px 14px;display:flex;flex-direction:column;gap:12px}
.hero .seg{background:rgba(0,0,0,.22)}
.hero .seg button{color:var(--hero-ink-2)}
.hero .seg button[aria-pressed="true"]{background:var(--hero-gold);color:#1b1404;box-shadow:none}
.hlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--hero-ink-2);font-weight:700;padding:0 4px}
.hlegend span{display:inline-flex;align-items:center;gap:6px}
.hlegend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.rangesum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 4px}
.rangesum div{display:flex;flex-direction:column;gap:1px}
.rangesum small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-ink-2);font-weight:800}
.rangesum b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}

/* ============================ kpis ============================ */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi .k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--ink-2)}
.kpi .badge{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.kpi .v{font-size:clamp(18px,5.2vw,22px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted);font-weight:600;margin-top:-4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}

.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1000px){.grid2{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px}}

/* ============================ allocation ============================ */
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%}
.stack i:first-child{border-radius:8px 0 0 8px} .stack i:last-child{border-radius:0 8px 8px 0}
.legendlist{display:flex;flex-direction:column;margin-top:12px}
.lrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:44px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .sw{width:12px;height:12px;border-radius:4px}
.lrow .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .pc{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.lrow .eu{font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}

/* ============================ holdings ============================ */
.hlist{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:1000px){.hlist{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.hcard{overflow:hidden}
.hmain{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;width:100%;text-align:left}
.mono-tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em;
  box-shadow:inset 0 -10px 18px rgba(0,0,0,.14)}
.hname{display:flex;flex-direction:column;min-width:0;gap:2px}
.hname b{font-size:15px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hname span{font-size:11.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hval{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.hval b{font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.hmeta{display:flex;align-items:center;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.hmeta .facts{font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.wbar{flex:1;min-width:60px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.wbar i{display:block;height:100%;border-radius:3px}
.hdetail{border-top:1px dashed var(--line-2);padding:12px 14px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:12px}
.facts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.facts-grid div{display:flex;flex-direction:column;gap:1px;min-width:0}
.facts-grid small{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
.facts-grid b{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lots{display:flex;flex-direction:column}
.lot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lot:last-child{border-bottom:0}
.lot .d{font-weight:800;font-size:13px}
.lot .q{font-size:12px;color:var(--muted);font-weight:600}
.lot .c{text-align:right;font-weight:800;font-size:13px}
.lot .g{text-align:right;font-size:12px;font-weight:800}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--gold-wash);font-size:12.5px;color:var(--ink-2);font-weight:600;line-height:1.45}
.note svg{flex:none;margin-top:1px;color:var(--gold)}
.note b{color:var(--ink)}

/* ============================ closed P/L (diverging bars) ============================ */
.div-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:10px;align-items:center;min-height:40px}
.div-row .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.div-track{position:relative;height:26px}
.div-track::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line-2)}
.div-bar{position:absolute;top:4px;height:18px}
.div-bar.p{left:50%;border-radius:0 4px 4px 0;background:var(--pos)} .div-bar.n{right:50%;border-radius:4px 0 0 4px;background:var(--neg)}

<script>
"use strict";
/* ============================== data ============================== */
const P = window.PORTFOLIO || window.PORTFOLIO_DEMO;
const T = P.totals;
const IS_DEMO = !!P.meta.isDemo;
const SERIES = P.series.map(([d, v, c]) => ({ t: Date.parse(d + "T00:00:00Z"), d, v, c })).filter((p, i, a) => i === 0 || p.t > a[i - 1].t);
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
P.holdings.forEach((h, i) => { h.color = COLORS[i] || "var(--muted)"; });

/* ============================== format ============================== */
const nf2 = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf1 = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 0 });
const nfq = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 4 });
const NB = " ";
const eur = n => "€" + NB + nf2.format(n);
const eur0 = n => "€" + NB + nf0.format(n);
const eurS = n => (n < 0 ? "−" : "+") + "€" + NB + nf2.format(Math.abs(n));
const pct = (n, d = 1) => (n < 0 ? "−" : "+") + (d === 1 ? nf1 : nf2).format(Math.abs(n)) + NB + "%";
const arrow = n => (n < 0 ? "▼" : "▲");
const cls = n => (n < 0 ? "neg" : "pos");
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD = d => { const [y, m, dd] = d.slice(0, 10).split("-"); return `${+dd} ${MONTHS[+m - 1]} ${y}`; };
const fmtMY = d => { const [y, m] = d.slice(0, 7).split("-"); return `${MONTHS[+m - 1]} ${y}`; };
const fmtTime = iso => { const t = new Date(iso); return isNaN(t) ? "" : t.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const monogram = name => {
  const w = name.replace(/^Core\s+/i, "").replace(/[^A-Za-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : (w[0] || "?").slice(0, 2)).toUpperCase();
};
const exchangeName = x => ({ langschwarz: "Lang & Schwarz", xetra: "Xetra", frankfurt: "Frankfurt", tradegate: "Tradegate", nasdaq: "Nasdaq", nyse: "NYSE" })[x] || x;
const toast = msg => {
  const host = document.getElementById("toastHost");
  host.innerHTML = `<div class="toast" role="status">${msg}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { host.innerHTML = ""; }, 4200);
};

const ICON = {
  overview: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>',
  holdings: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M14.5 2.6A9 9 0 0 1 21.4 9.5H14.5z"/></svg>',
  activity: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>',
  import: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 12-4-4m4 4 4-4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
  more: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
  moon: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  sun: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  buy: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  sell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  dividend: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M16.5 7.5c0-1.7-2-3-4.5-3s-4.5 1.3-4.5 3S9.5 10 12 10.5s4.5 1.3 4.5 3.2-2 3-4.5 3-4.5-1.3-4.5-3"/></svg>',
  info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
};

const icon = (k, px) => ICON[k].replace(/width="\d+" height="\d+"/, `width="${px}" height="${px}"`);

/* ============================== guilloché ============================== */
/* Banknote security-print rosette + wave band, generated (not hand-drawn) to the hero's real size. */
function guilloche(w, h) {
  const out = [];
  const cx = w * 0.9, cy = Math.min(h * 0.16, 90), R0 = Math.min(Math.max(w * 0.42, 150), 260);
  for (let i = 0; i < 16; i++) {
    const R = R0 - i * 7, A = 7 + (i % 4) * 1.6, k = 14, ph = i * 0.33;
    let d = "";
    for (let s = 0; s <= 420; s++) {
      const th = (s / 420) * Math.PI * 2, r = R + A * Math.sin(k * th + ph) + 3 * Math.sin(3 * th - ph);
      d += (s ? "L" : "M") + (cx + r * Math.cos(th)).toFixed(1) + " " + (cy + r * Math.sin(th)).toFixed(1);
    }
    out.push(`<path d="${d}Z" stroke="${i % 3 === 0 ? "rgba(230,184,90,.30)" : "rgba(230,184,90,.13)"}"/>`);
  }
  const base = h * 0.6;
  for (let i = 0; i < 12; i++) {
    let d = "";
    for (let x = -10; x <= w + 10; x += 6) {
      const y = base + i * 6 + 14 * Math.sin(x / 46 + i * 0.42) + 6 * Math.sin(x / 17 - i * 0.7);
      d += (x === -10 ? "M" : "L") + x + " " + y.toFixed(1);
    }
    out.push(`<path d="${d}" stroke="rgba(120,215,190,${i % 4 === 0 ? 0.16 : 0.07})"/>`);
  }
  return `<svg class="guilloche" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke-width="0.8" vector-effect="non-scaling-stroke">${out.join("")}</g></svg>`;
}

/* ============================== chart ============================== */
const RANGE_KEYS = ["1M", "6M", "YTD", "1Y", "5Y", "MAX"];
function rangeStart(k) {
  const end = SERIES[SERIES.length - 1].t, d = new Date(end);
  if (P.ranges?.[k]?.start) return Date.parse(P.ranges[k].start + "T00:00:00Z");
  if (k === "MAX") return SERIES[0].t;
  if (k === "YTD") return Date.UTC(d.getUTCFullYear(), 0, 1);
  const m = { "1M": 1, "6M": 6, "1Y": 12, "5Y": 60 }[k];
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - m, d.getUTCDate());
}
function seriesFor(k) {
  const from = rangeStart(k);
  let i = SERIES.findIndex(p => p.t >= from);
  if (i < 0) i = SERIES.length - 2;
  if (i > 0 && SERIES[i].t > from) i--;                 // carry the last known value into the window
  const pts = SERIES.slice(Math.max(0, i));
  // trim the empty prehistory (portfolio worth 0 before the first trade)
  const firstNZ = pts.findIndex(p => p.v > 0 || p.c > 0);
  return firstNZ > 0 ? pts.slice(firstNZ - 1) : pts;
}
function niceTicks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), r = raw / mag;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(v);
  return { ticks: out, lo: a, hi: b };
}
const tickLabel = v => v >= 1000 ? "€" + nf0.format(v / 1000) + "k" : "€" + nf0.format(v);

function drawChart(host, pts) {
  const W = Math.max(280, Math.round(host.clientWidth)), H = W < 560 ? 196 : 250;
  const padT = 12, padB = 24, ih = H - padT - padB;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const vals = pts.flatMap(p => [p.v, p.c]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.1 || 1;
  const nt = niceTicks(Math.max(0, lo - pad), hi + pad, 3);
  lo = nt.lo; hi = nt.hi;
  const X = t => 8 + ((t - t0) / ((t1 - t0) || 1)) * (W - 16);
  const Y = v => padT + ih - ((v - lo) / ((hi - lo) || 1)) * ih;
  const path = key => pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p[key]).toFixed(1)).join("");
  const area = key => path(key) + `L${X(t1).toFixed(1)} ${padT + ih}L${X(t0).toFixed(1)} ${padT + ih}Z`;
  const grid = nt.ticks.map(v => `
    <line x1="8" x2="${W - 8}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(255,255,255,.09)"/>
    <text x="10" y="${(Y(v) - 4).toFixed(1)}" font-size="10.5" font-weight="700" fill="rgba(243,247,242,.55)" font-family="Manrope,system-ui,sans-serif">${tickLabel(v)}</text>`).join("");
  // x labels: years for long spans, months otherwise — 3 to 5 labels, never colliding
  const spanD = (t1 - t0) / 864e5, xl = [];
  if (spanD > 700) {
    const y0 = new Date(t0).getUTCFullYear() + 1, y1 = new Date(t1).getUTCFullYear(), every = Math.ceil((y1 - y0 + 1) / (W < 560 ? 4 : 7));
    for (let y = y0; y <= y1; y += every) xl.push([Date.UTC(y, 0, 1), String(y)]);
  } else {
    const n = W < 560 ? 3 : 5;
    for (let i = 0; i < n; i++) { const t = t0 + (i / (n - 1)) * (t1 - t0); xl.push([t, fmtD(new Date(t).toISOString()).replace(/^\d+ /, "")]); }
  }
  const xlab = xl.map(([t, s], i) => {
    const x = X(t), anchor = x < 30 ? "start" : x > W - 30 ? "end" : "middle";
    return `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="${anchor}" font-size="10.5" font-weight="700" fill="rgba(243,247,242,.55)" font-family="Manrope,system-ui,sans-serif">${s}</text>`;
  }).join("");
  const lp = pts[pts.length - 1];
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="Portfolio value and invested capital, ${fmtD(pts[0].d)} to ${fmtD(lp.d)}">
    <defs><linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b85a" stop-opacity=".42"/><stop offset="1" stop-color="#e6b85a" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <path d="${area("c")}" fill="var(--hero-band)"/>
    <path d="${path("c")}" fill="none" stroke="var(--hero-band-line)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="${area("v")}" fill="url(#gv)"/>
    <path d="${path("v")}" fill="none" stroke="var(--hero-gold)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(lp.t).toFixed(1)}" cy="${Y(lp.v).toFixed(1)}" r="4.5" fill="var(--hero-gold)" stroke="#0b2c27" stroke-width="2.5"/>
    <g id="scrub" opacity="0">
      <line y1="${padT}" y2="${padT + ih}" stroke="rgba(255,255,255,.45)" stroke-width="1"/>
      <circle r="5" fill="var(--hero-gold)" stroke="#0b2c27" stroke-width="2.5"/>
      <circle r="4" fill="#aae2d0" stroke="#0b2c27" stroke-width="2"/>
    </g>
    ${xlab}
  </svg>`;
  return { X, Y, pts, W };
}

function wireScrub(host, geo, readout, idle) {
  const svg = host.querySelector("svg"), g = svg.querySelector("#scrub");
  const [ln, dv, dc] = g.children;
  const at = clientX => {
    const r = svg.getBoundingClientRect(), x = (clientX - r.left) * (geo.W / r.width);
    const pts = geo.pts;
    let lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (geo.X(pts[m].t) < x) lo = m; else hi = m; }
    const p = Math.abs(geo.X(pts[lo].t) - x) < Math.abs(geo.X(pts[hi].t) - x) ? pts[lo] : pts[hi];
    const cx = geo.X(p.t);
    g.setAttribute("opacity", "1");
    ln.setAttribute("x1", cx); ln.setAttribute("x2", cx);
    dv.setAttribute("cx", cx); dv.setAttribute("cy", geo.Y(p.v));
    dc.setAttribute("cx", cx); dc.setAttribute("cy", geo.Y(p.c));
    readout.innerHTML = `<b>${fmtD(p.d)}</b><span class="g">Value ${eur(p.v)}</span><span>Invested ${eur(p.c)}</span>`;
  };
  let hold = 0;
  const end = () => { clearTimeout(hold); g.setAttribute("opacity", "0"); readout.innerHTML = idle; };
  host.onpointerdown = e => { clearTimeout(hold); at(e.clientX); };
  host.onpointermove = e => { if (e.pointerType === "mouse" || e.buttons || e.pressure > 0) at(e.clientX); };
  // touch: a tap is the natural phone gesture, so the value stays readable after the finger lifts
  host.onpointerup = e => { if (e.pointerType !== "mouse") { clearTimeout(hold); hold = setTimeout(end, 2500); } };
  host.onpointerleave = e => { if (e.pointerType === "mouse") end(); };
  host.onpointercancel = end;   // vertical scroll took over the gesture
}
</script>

}

    : `<section class="card">
      <div class="source"><span class="logo">P</span>
        <div><h3>Parqet <span class="chip ${bad.length ? "neg" : "pos"}" style="vertical-align:2px">${bad.length ? bad.length + " to fix" : "✓ In sync"}</span></h3>
          <p>${esc(P.meta.portfolio.name)} · last sync ${fmtTime(P.meta.convertedAt || P.meta.asOf)}</p></div></div>
      <div class="statgrid">
        <div><b>${sync.activities}</b><small>activities</small></div>
        <div><b>${sync.holdingsOpen}</b><small>open positions</small></div>
        <div><b>${sync.holdingsClosed}</b><small>closed</small></div>
      </div>
      <div class="cardhead" style="padding-top:16px"><h2 style="font-size:14px">Reconciliation</h2><span class="sub">lots rebuilt from the ledger vs. Parqet</span></div>
      <div class="recon">${sync.reconcile.map(c => `<div class="recon-row">
          <span class="ok ${c.ok ? "" : "bad"}">${c.ok ? "✓" : "!"}</span>
          <span><b>${esc(c.name)}</b><span>${c.ok ? `${c.shares ? nfq.format(c.shares.ours) + " shares · " : ""}matches ${esc((c.matches || [method])[0])}` : esc(c.issue || "does not reconcile")}</span></span>
          ${c.splits?.length ? `<span class="chip warn">${c.splits.map(s => s.ratio + ":1").join(" ")} split</span>` : `<span></span>`}
        </div>`).join("")}</div>
      ${splits.length ? `<div style="padding:4px 16px 0"><div class="note">${ICON.info}<span>Parqet's activity feed isn't split-adjusted. Applied on ex-date: <b>${splits.join(", ")}</b>.</span></div></div>` : ""}
      <div class="btnrow"><button class="btn primary" data-sync="1">Sync now</button><button class="btn" data-howsync="1">How sync works</button></div>
    </section>`;

  const I = S.imp;
  let flow = "";
  if (!I) {
    flow = `<div class="cardbody"><div class="brokers">${BROKERS.map(b => `<button class="broker" data-broker="${b.k}">
        <span class="bt" style="background:${b.c}">${b.n.slice(0, 2).toUpperCase()}</span><b>${b.n}</b><span>${b.s}</span></button>`).join("")}</div>
      <p class="muted" style="font-size:12.5px;font-weight:600;margin:12px 0 0">Pick a broker to walk through the import flow with an <b>example file</b> — nothing touches your ledger.</p></div>`;
  } else {
    const b = BROKERS.find(x => x.k === I.broker), c = icount(I.rows);
    const names = ["File", "Map", "Review", "Done"];
    const steps = `<div class="steps">${names.map((n, i) => `${i ? '<span class="sep"></span>' : ""}<span class="st ${I.step === i + 1 ? "on" : I.step > i + 1 ? "done" : ""}"><i>${I.step > i + 1 ? "✓" : i + 1}</i>${n}</span>`).join("")}</div>`;
    let body = "";
    if (I.step === 1) body = `<div class="cardbody">
        <div class="recon-row" style="border:0"><span class="ok">✓</span><span><b class="mono" style="font-weight:500;font-size:13px;word-break:break-all">${b.file}</b>
          <span>${b.ad ? `${b.ad} · 96% confidence · Windows-1252 · 9 rows` : "No adapter matched — map the columns once and it becomes a saved profile"}</span></span><span></span></div>
        <div class="btnrow" style="padding:12px 0 0"><button class="btn" data-imp="cancel">Cancel</button><button class="btn primary" data-imp="2">${b.ad ? "Check mapping" : "Map columns"}</button></div></div>`;
    if (I.step === 2) body = `<div class="cardbody" style="display:flex;flex-direction:column;gap:12px">
        <div class="rawprev"><pre>Buchungstag;Valuta;Text;ISIN;Stück;Kurs;Spesen;KESt;Betrag
02.07.2026;04.07.2026;Kauf Sparplan;IE00BK5BQT80;12,4831;121,03;1,50;0,00;-1.512,30
04.07.2026;04.07.2026;Dividende;AT0000743059;;;0,00;39,05;102,95</pre></div>
        <div class="fmt"><b>Preview</b><span class="mono">1.512,30</span>→<span class="mono">1512.30</span><span class="mono">02.07.2026</span>→<span class="mono">2026-07-02</span></div>
        <div class="mapgrid">${[["Execution date", "Buchungstag"], ["Settlement date", "Valuta"], ["Type", "Text"], ["ISIN", "ISIN"], ["Quantity", "Stück"], ["Fee", "Spesen"], ["Tax (KESt)", "KESt"], ["Net amount", "Betrag"]]
          .map(([k, v]) => `<div class="maprow"><label for="map-${v}">${k}</label><select id="map-${v}"><option>${v}</option><option>— not mapped —</option></select></div>`).join("")}
          <div class="maprow"><label for="fmt-dec">Number format</label><select id="fmt-dec"><option>1.234,56 (AT/DE)</option><option>1,234.56 (US/UK)</option></select></div>
        </div>
        <div class="btnrow" style="padding:0"><button class="btn" data-imp="1">Back</button><button class="btn primary" data-imp="3">Parse 9 rows</button></div></div>`;
    if (I.step === 3) {
      const shown = I.rows.filter(r => I.filter === "all" || r.st === I.filter);
      body = `<div class="cardbody" style="padding-bottom:6px"><div class="filters" style="margin:0;padding:0;flex-wrap:wrap;overflow:visible">${[["all", "All"], ["new", "New"], ["dup", "Duplicates"], ["attn", "Needs attention"]]
          .map(([k, l]) => `<button class="fchip" data-ifilter="${k}" aria-pressed="${I.filter === k}">${l}<span class="ct">${c[k]}</span></button>`).join("")}</div></div>
        <div>${shown.map(r => `<div class="rcard" data-st="${r.st}">
          <input type="checkbox" data-irow="${r.i}" ${r.on ? "checked" : ""} ${r.st === "attn" ? "disabled" : ""} aria-label="Include ${esc(r.s)} on ${r.d}">
          <span class="t"><b>${esc(r.s)}</b><span>${fmtD(r.d)} · ${r.t}${r.lbl ? " · " + esc(r.lbl) : ""}</span>
            ${r.isin ? `<span class="mono">${r.isin}${r.q ? " · " + r.q : ""}</span>` : ""}
            ${r.tax ? `<span>gross ${eur(r.gross)} · KESt ${eur(r.tax)}</span>` : ""}
            ${r.issue ? `<span style="color:${r.st === "attn" ? "var(--warn)" : "var(--muted)"};font-weight:700">${esc(r.issue)}</span>` : ""}</span>
          <span class="a ${r.net > 0 ? "pos" : ""}">${eurS(r.net)}</span>
          ${r.st === "attn" ? `<div class="fix">${r.fix === "isin"
            ? `<button class="cand" data-fix="${r.i}" data-c="MSFT · Nasdaq · USD"><b>Microsoft</b><span class="mono muted">MSFT · Nasdaq · USD</span><span class="m">98%</span></button>
               <button class="cand" data-fix="${r.i}" data-c="MSF · Xetra · EUR"><b>Microsoft</b><span class="mono muted">MSF · Xetra · EUR</span><span class="m">91%</span></button>`
            : `<button class="cand" data-fix="${r.i}" data-c="tax"><b>Import as tax charge</b><span class="m">keeps cash right</span></button>`}</div>` : ""}
        </div>`).join("")}</div>
        <div class="btnrow"><button class="btn" data-imp="2">Back</button><button class="btn primary" data-imp="commit" ${c.on ? "" : "disabled"}>Import ${c.on}</button></div>`;
    }
    if (I.step === 4) body = `<div class="donebox"><span class="tick"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span>
        <b style="font-size:17px">${I.done} transactions imported</b>
        <span class="muted" style="font-weight:600;font-size:13.5px;max-width:42ch">Example only — your ledger is unchanged. A real import is one batch you can undo at any time.</span>
        <div class="btnrow" style="width:100%;max-width:420px"><button class="btn" data-imp="undo">Undo import</button><button class="btn primary" data-imp="cancel">Done</button></div></div>`;
    flow = steps + body;
  }
  return `
  <header class="pagehead"><span class="eyebrow">Sources & files</span><h1>Import</h1>
    <p>Connected sources sync automatically. Broker files go through review first — nothing reaches the ledger unseen.</p></header>
  ${sourceCard}
  <section class="card"><div class="cardhead"><h2>Import a file</h2>${I ? `<span class="chip warn">Example</span>` : `<span class="sub">CSV · XLSX · PDF</span>`}</div>${flow}</section>`;
}

/* ============================== more ============================== */
function vMore() {
  const theme = currentThemeSetting();
  const diff = austriaBasis - T.invested;
  return `
  <header class="pagehead"><span class="eyebrow">Account & settings</span><h1>More</h1></header>
  <section class="card">
    <div class="source"><span class="mono-tile" style="background:linear-gradient(140deg,var(--hero-b),var(--hero-a));color:var(--hero-gold);font-family:var(--f-display);font-size:22px;font-weight:400">${esc(P.meta.portfolio.name.slice(0, 1))}</span>
      <div><h3>${esc(P.meta.portfolio.name)}</h3><p>${IS_DEMO ? "Demo depot" : "Synced from Parqet"} · ${P.meta.currency} · since ${fmtD(P.meta.since || SERIES[0].d)}</p></div></div>
    <div class="statgrid" style="padding-bottom:16px">
      <div><b>${eur0(T.value)}</b><small>value</small></div><div><b>${P.holdings.length}</b><small>open</small></div><div><b>${P.ledger.length}</b><small>activities</small></div>
    </div>
  </section>
  <section class="card">
    <div class="cardhead"><h2>Cost basis</h2></div>
    <div class="srow"><div><b>${esc(T.costBasisMethod || "FIFO")}</b><br><span>Matches Parqet, so gains agree with what you see there.</span></div>
      <select aria-label="Cost basis method"><option>FIFO, fees excluded</option><option>Moving average, fees excluded (AT KESt)</option></select></div>
    ${Math.abs(diff) >= 0.01 ? `<div style="padding:0 16px 16px"><div class="note">${ICON.info}<span>For Austrian KESt, privately held securities use <b>moving average, fees excluded</b>. Your basis would be <b>${eur(austriaBasis)}</b> — ${eurS(diff)} against FIFO.</span></div></div>` : ""}
  </section>
  <section class="card">
    <div class="cardhead"><h2>Appearance</h2></div>
    <div class="cardbody"><div class="seg" role="group" aria-label="Theme">
      ${[["system", "System"], ["light", "Light"], ["dark", "Dark"]].map(([k, l]) => `<button data-theme-set="${k}" aria-pressed="${theme === k}">${l}</button>`).join("")}</div></div>
  </section>
  <section class="card">
    <div class="cardhead"><h2>Data & privacy</h2></div>
    <div class="srow"><div><b>${IS_DEMO ? "Demo snapshot" : "Local snapshot"}</b><br><span>${IS_DEMO
      ? "Fictional data shipped with the repository."
      : "Lives in <span class='mono'>portfolio.local.js</span>, which is gitignored. The repository is public — personal data never goes into it."}</span></div>
      <span class="chip ${IS_DEMO ? "warn" : "jade"}" style="justify-self:start">${IS_DEMO ? "Demo" : "Private"}</span></div>
    <div class="srow"><div><b>Prices</b><br><span>Last quotes from ${exchangeName(P.holdings[0]?.quote?.exchange || "—")} · ${fmtTime(P.meta.asOf)}</span></div></div>
  </section>`;
}

/* ============================== theme ============================== */
const root = document.documentElement;
const sysDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
function currentThemeSetting() { try { return localStorage.getItem("dl-theme") || "system"; } catch { return "system"; } }
function applyTheme(mode) {
  if (mode === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", mode);
  try { localStorage.setItem("dl-theme", mode); } catch {}
  const dark = mode === "dark" || (mode === "system" && sysDark());
  const btn = document.getElementById("themeBtn");
  btn.innerHTML = dark ? ICON.sun : ICON.moon;
  btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
}

/* ============================== router ============================== */
const VIEWS = { overview: vOverview, holdings: vHoldings, activity: vActivity, import: vImport, more: vMore };
const NAV = [["overview", "Overview"], ["holdings", "Holdings"], ["activity", "Activity"], ["import", "Import"], ["more", "More"]];
const view = document.getElementById("view");
let ro = null, lastW = 0;

function renderNav() {
  const bad = (P.sync?.reconcile || []).filter(c => !c.ok).length;
  document.getElementById("bottomNav").innerHTML = NAV.map(([k, l]) => `<a class="tab" href="#${k}" ${S.view === k ? 'aria-current="page"' : ""}>
    <span class="ic">${ICON[k]}</span>${l}${k === "import" && bad ? `<span class="dotbadge">${bad}</span>` : ""}</a>`).join("");
  document.getElementById("railNav").innerHTML = NAV.map(([k, l]) => `<a class="navitem" href="#${k}" ${S.view === k ? 'aria-current="page"' : ""}>
    ${ICON[k]}${l}${k === "import" && bad ? `<span class="cnt">${bad}</span>` : ""}</a>`).join("");
}
function render() {
  renderNav();
  view.innerHTML = VIEWS[S.view]();
  if (ro) { ro.disconnect(); ro = null; }
  if (S.view === "overview") mountHero();
}
function mountHero() {
  const hero = document.getElementById("hero"), host = document.getElementById("chart"), readout = document.getElementById("readout");
  const idle = readout.innerHTML;
  const paint = () => {
    const geo = drawChart(host, seriesFor(S.range));
    wireScrub(host, geo, readout, idle);
    document.getElementById("gbg").innerHTML = guilloche(hero.clientWidth, hero.clientHeight);
  };
  paint(); lastW = host.clientWidth;
  ro = new ResizeObserver(() => { const w = host.clientWidth; if (Math.abs(w - lastW) >= 2) { lastW = w; paint(); } });
  ro.observe(hero);
}
function route() {
  const k = (location.hash || "#overview").slice(1);
  S.view = VIEWS[k] ? k : "overview";
  render(); window.scrollTo({ top: 0 });
}

/* ============================== events ============================== */
view.addEventListener("click", e => {
  const q = sel => e.target.closest(sel);
  let el;
  if ((el = q("[data-range]"))) { S.range = el.dataset.range; return render(); }
  if ((el = q("[data-hold]"))) { const id = el.dataset.hold; if (S.view !== "holdings") { S.open.add(id); location.hash = "#holdings"; return; } S.open.has(id) ? S.open.delete(id) : S.open.add(id); return render(); }
  if ((el = q("[data-hf]"))) { S.hfilter = el.dataset.hf; return; }
  if ((el = q("[data-hfilter]"))) { S.hfilter = el.dataset.hfilter; return render(); }
  if ((el = q("[data-afilter]"))) { S.afilter = el.dataset.afilter; S.apage = 60; return render(); }
  if ((el = q("[data-more]"))) { S.apage += 60; return render(); }
  if ((el = q("[data-theme-set]"))) { applyTheme(el.dataset.themeSet); return render(); }
  if ((el = q("[data-sync]"))) return toast("Ask Claude to “sync Parqet” — it captures fresh payloads and runs tools/parqet-import. This page then shows the new snapshot.");
  if ((el = q("[data-howsync]"))) return toast("Parqet → raw payloads (gitignored) → convert.mjs rebuilds lots, applies splits, reconciles → portfolio.local.js.");
  if ((el = q("[data-broker]"))) { S.imp = newImport(el.dataset.broker); return render(); }
  if ((el = q("[data-ifilter]"))) { S.imp.filter = el.dataset.ifilter; return render(); }
  if ((el = q("[data-fix]"))) {
    const r = S.imp.rows.find(x => x.i === +el.dataset.fix), c = el.dataset.c;
    if (c === "tax") r.issue = "Recorded as a tax charge"; else { r.s = "Microsoft"; r.issue = "Linked to " + c; }
    r.st = "new"; r.on = true; r.fix = null; return render();
  }
  if ((el = q("[data-imp]"))) {
    const a = el.dataset.imp;
    if (a === "cancel") S.imp = null;
    else if (a === "commit") { S.imp.done = icount(S.imp.rows).on; S.imp.step = 4; }
    else if (a === "undo") { const b = S.imp.broker; S.imp = newImport(b); S.imp.step = 3; toast("Import undone — the batch was removed in one step."); }
    else S.imp.step = +a;
    return render();
  }
});
view.addEventListener("change", e => {
  const r = e.target.closest("[data-irow]");
  if (r) { S.imp.rows.find(x => x.i === +r.dataset.irow).on = r.checked; render(); }
});
document.getElementById("themeBtn").addEventListener("click", () => {
  const dark = root.getAttribute("data-theme") === "dark" || (!root.hasAttribute("data-theme") && sysDark());
  applyTheme(dark ? "light" : "dark"); if (S.view === "more") render();
});
window.addEventListener("hashchange", route);
window.addEventListener("scroll", () => document.getElementById("topbar").classList.toggle("scrolled", window.scrollY > 4), { passive: true });

/* ============================== boot ============================== */
document.getElementById("topSub").textContent = document.getElementById("railSub").textContent = `${P.meta.portfolio.name} · ${eur0(T.value)}`;
document.getElementById("srcLabel").textContent = IS_DEMO ? "Demo data" : "Parqet";
document.getElementById("srcPill").classList.toggle("demo", IS_DEMO);
document.getElementById("railFoot").innerHTML = IS_DEMO ? "Demo data — fictional." : `Synced from Parqet<br>${fmtTime(P.meta.convertedAt || P.meta.asOf)}`;
applyTheme(currentThemeSetting());
route();
</script>
